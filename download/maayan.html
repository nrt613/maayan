  --warn-bg: #2c2419; --warn-ink: #e7c08b; --danger: #ec8ea1; --danger-soft: #33191f; --good: #8fc7a2; --good-soft: #1a2a20;
  --shadow: 0 1px 2px rgb(0 0 0 / .45); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; font-weight: 700; text-wrap: balance; }
h1, h2, .brand, .cal-h h3, .ring strong, .times dd { font-family: var(--display); font-weight: 600; }
h1 { font-size: 30px; } h2 { font-size: 24px; } h3 { font-size: 16px; font-weight: 600; } h4 { font-size: 13px; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { flex-shrink: 0; }
.hebdate { font-weight: 500; }
time, [dir="ltr"], dd, .count, .ring strong, input[type="time"], input[type="date"] { font-variant-numeric: tabular-nums; }

#app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 26px; padding: 22px 14px; background: var(--surface); border-inline-start: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 600; line-height: 1.1; padding-inline: 8px; color: var(--ink); }
.brand small { display: block; font-family: var(--font); font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(150deg, #e98aa9, var(--accent) 55%, #7e2c55); color: #fff; box-shadow: 0 3px 10px rgb(178 72 111 / .3); }
.mark.big { width: 72px; height: 72px; margin-inline: auto; box-shadow: 0 0 0 8px var(--accent-soft), 0 8px 24px rgb(178 72 111 / .3); }
.side nav { display: grid; gap: 2px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-radius: 99px; background: transparent; color: var(--muted); text-align: start; font-weight: 500; }
.nav:hover { background: var(--soft); color: var(--ink); }
.nav.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.badge { margin-inline-start: auto; min-width: 22px; padding: 0 6px; border-radius: 99px; background: var(--soft); color: var(--muted); text-align: center; font-size: 12px; }
.nav.on .badge { background: var(--surface); color: var(--accent-strong); }
.side-note { margin-top: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); padding-inline: 8px; }

.work { min-width: 0; position: relative; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; min-height: 60px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.brand.m { display: none; font-size: 19px; padding: 0; }
.brand.m .mark { width: 32px; height: 32px; }
.top-date { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.top-date .hebdate { font-size: 16px; font-weight: 600; }
.top-date small { color: var(--muted); font-size: 12.5px; }
.top-act { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; gap: 6px; align-items: center; padding: 7px 12px; border-radius: 99px; border: 0; background: var(--soft); font-size: 13.5px; color: var(--ink); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.icon-btn.danger { color: var(--danger); }
.push { margin-inline-start: auto; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--accent-soft); color: var(--accent-strong); font-size: 13.5px; font-weight: 500; }
.banner span { flex: 1 1 200px; }
.banner button { border: 0; background: var(--surface); color: var(--ink); border-radius: 99px; padding: 5px 12px; font-size: 13px; box-shadow: var(--shadow); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }

main { padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1120px; margin-inline: auto; display: grid; gap: 16px; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; }
.card-h > .ic { color: var(--faint); }
.card-h > div { min-width: 0; flex: 1; }
.card-h p { color: var(--muted); font-size: 13px; margin-top: 1px; }
.card-h .link, .card-h .btn { margin-inline-start: auto; }
.count { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 99px; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; vertical-align: 2px; }
.fine { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); padding: 8px 0; font-size: 14px; }
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.stack-s { display: grid; gap: 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 9px 22px; border-radius: 99px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; transition: filter .15s, transform .1s; box-shadow: 0 4px 14px rgb(178 72 111 / .22); }
.btn:active { transform: scale(.98); }
.btn.ghost, .btn.danger { box-shadow: none; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.light { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 13.5px; box-shadow: none; }
.btn.full { width: 100%; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); padding: 4px 2px; font-weight: 600; font-size: 14px; }
.link.danger { color: var(--danger); justify-self: start; }

/* היום */
.grid-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.grid-bottom { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 24px; background: radial-gradient(120% 90% at 100% 0%, var(--blush), transparent 60%), radial-gradient(90% 80% at 0% 100%, var(--peach), transparent 65%), var(--surface); box-shadow: var(--shadow); display: grid; gap: 22px; }
.hero::after { content: ""; position: absolute; width: 180px; height: 180px; inset-inline-start: -60px; top: -70px; border-radius: 50%; border: 1px solid var(--ring-a); box-shadow: 0 0 0 22px var(--ring-b), 0 0 0 23px var(--ring-a); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-row { display: flex; gap: 18px; align-items: center; justify-content: space-between; }
.hero-copy { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.hero h2 { font-size: 28px; }
.hero p { color: var(--muted); max-width: 44ch; }
.hero .btn { margin-top: 6px; }
.chip-light { display: inline-flex; padding: 3px 12px; border-radius: 99px; background: var(--surface); color: var(--accent-strong); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); }
.ring { --p: 0; flex-shrink: 0; width: 112px; height: 112px; border-radius: 50%; display: grid; place-content: center; text-align: center;
  background: radial-gradient(closest-side, var(--surface) 84%, transparent 85%), conic-gradient(from 0deg, #f2a7bf, var(--accent) calc(var(--p) * 100%), var(--line) 0); }
.ring strong { font-size: 42px; line-height: 1; color: var(--accent-strong); } .ring small { color: var(--muted); font-size: 12px; }
.ring.idle { color: var(--accent); background: radial-gradient(closest-side, var(--surface) 84%, transparent 85%), conic-gradient(var(--line) 100%, var(--line) 0); }
.seven { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.seven li { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
.seven span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 13px; }
.seven .past span { background: var(--accent-soft); border-color: transparent; color: var(--accent-strong); }
.seven .now span { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 0 4px var(--accent-soft); }
.times dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.times dl div { display: grid; justify-items: center; gap: 2px; padding: 12px 6px; border-radius: 18px; background: var(--soft); text-align: center; }
.times dl .ic { color: var(--faint); }
.times dt { font-size: 12.5px; color: var(--muted); order: 2; }
.times dd { font-size: 20px; order: 1; }
.times dl .hl { background: var(--accent-soft); }
.times dl .hl .ic, .times dl .hl dd { color: var(--accent-strong); }
.notice { display: flex; align-items: center; gap: 12px; text-align: start; padding: 14px 16px; border-radius: var(--r); border: 0; background: var(--warn-bg); color: var(--warn-ink); }
.notice span { flex: 1; display: grid; } .notice small { opacity: .85; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.checks label { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.checks label.on span { text-decoration: line-through; color: var(--faint); }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
.welcome-inline p { color: var(--muted); }

/* מועדים */
.plans { display: grid; }
.plan { border-bottom: 1px solid var(--line); position: relative; }
.plan:last-child { border-bottom: 0; }
.plan::before { content: ""; position: absolute; inset-inline-start: 0; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.plan.k-monthly::before, .plan.k-interval::before, .plan.k-average::before, .plan.k-or-zarua::before, .plan.k-manual::before { background: var(--sep); }
.plan.k-mikvah::before { background: var(--mikvah); }
.plan.k-bedikah::before, .plan.k-hefsek::before { background: var(--clean); }
.plan.done { opacity: .55; }
.plan summary { display: flex; align-items: center; gap: 10px; padding: 11px 0; padding-inline-start: 20px; cursor: pointer; list-style: none; }
.plan summary::-webkit-details-marker, details summary::-webkit-details-marker { display: none; }
.plan-ic { display: none; }
.plan-name { flex: 1; display: grid; min-width: 0; }
.plan-name strong { font-weight: 600; font-size: 14.5px; }
.plan-name small { color: var(--muted); font-size: 12.5px; }
.plan time { font-weight: 600; color: var(--ink); }
details[open] > summary > .ic:last-child { transform: rotate(-90deg); }
summary > .ic:last-child { transition: transform .15s; color: var(--faint); }
.plan-more { display: grid; gap: 4px; padding: 0 20px 12px; font-size: 13.5px; color: var(--ink); }
.plan-more small { color: var(--muted); }
.plan-more a { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; justify-self: start; font-weight: 600; }
.ok-text { color: var(--good) !important; }
details.past > summary, .tgroup > summary, .reviews details > summary, .rules details > summary, .adv > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; list-style: none; padding: 12px 0; font-weight: 500; }
details.past { border-top: 1px solid var(--line); }

/* לוח */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cal-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cal-h h3 { font-size: 22px; }
.cal-nav { display: flex; gap: 2px; align-items: center; }
.seg { display: inline-flex; padding: 3px; border-radius: 99px; background: var(--soft); justify-self: start; }
.seg button { border: 0; background: transparent; padding: 6px 18px; border-radius: 99px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.wk, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wk span { text-align: center; color: var(--faint); font-size: 12px; font-weight: 500; padding-bottom: 4px; }
.day { position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; border: 0; border-radius: 16px; background: transparent; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; padding: 5px 2px 6px; min-width: 0; }
.day:hover { background: var(--soft); }
.day b { font-size: 16px; font-weight: 500; align-self: center; }
.day i { font-style: normal; font-size: 10.5px; color: var(--faint); }
.day.out { opacity: .35; }
.day.clean { background: color-mix(in srgb, var(--clean) 9%, transparent); }
.day.today b { color: var(--accent); font-weight: 700; }
.day.today::after { content: ""; position: absolute; inset: 2px; border-radius: 14px; border: 1.5px solid var(--accent); pointer-events: none; }
.day.sel { background: var(--accent); color: var(--accent-ink); }
.day.sel b { color: inherit; }
.day.sel i { color: inherit; opacity: .8; }
.dots { display: flex; gap: 3px; height: 6px; }
.dots em, .legend em { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.day.sel .dots em { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.d-f { background: var(--flow); } .d-c { background: var(--clean); } .d-s { background: var(--sep); } .d-m { background: var(--mikvah); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend em { width: 8px; height: 8px; }
.dayp .card-h h3 { font-size: 16px; }

/* יומן */
.entries { display: grid; }
.entry { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; border-radius: 0; }
.entries .entry:last-child { border-bottom: 0; }
.entry:hover { background: var(--soft); }
.entry-main { flex: 1; display: grid; min-width: 0; }
.entry-main strong { font-weight: 600; font-size: 14.5px; }
.entry-main small { color: var(--muted); font-size: 12.5px; }
.entry-main .note { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-side { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; }
.ev-ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.ev-ic.t-flow { color: var(--flow); background: color-mix(in srgb, var(--flow) 11%, var(--surface)); }
.ev-ic.t-hefsek, .ev-ic.t-bedikah { color: var(--clean); background: color-mix(in srgb, var(--clean) 11%, var(--surface)); }
.ev-ic.t-mikvah { color: var(--mikvah); background: color-mix(in srgb, var(--mikvah) 11%, var(--surface)); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters select { flex: 0 1 160px; }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 99px; background: var(--soft); color: var(--faint); }
.search input { flex: 1; border: 0 !important; background: transparent !important; padding: 10px 0; min-width: 0; color: var(--ink); outline: none; }
.reviews details { border-top: 1px solid var(--line); }
.reviews details p { color: var(--muted); font-size: 14px; padding-bottom: 6px; }
.reviews details .link { font-size: 13px; margin-inline-end: 10px; margin-bottom: 8px; }

/* טפסים */
.field { display: grid; gap: 6px; font-weight: 500; font-size: 13.5px; min-width: 0; color: var(--ink); }
.field small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.opt { color: var(--faint); font-weight: 400; font-size: 12.5px; }
input:not([type="checkbox"]), select, textarea { width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 400; font-size: 15.5px; transition: border-color .15s; }
input:not([type="checkbox"]):focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px !important; direction: ltr; text-align: left; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; cursor: pointer; }
.toggle span { display: grid; } .toggle strong { font-weight: 500; font-size: 14.5px; } .toggle small { color: var(--muted); font-size: 12.5px; }
.toggle input { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); transition: inset-inline-start .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { inset-inline-start: 21px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.save-bar { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px; border-radius: 99px; background: var(--surface); box-shadow: 0 6px 24px rgb(120 40 70 / .14); }
.save-bar small { color: var(--muted); }
.trip { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--soft); }
.trip span { display: grid; } .trip small { color: var(--muted); }
.action { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: start; color: var(--ink); }
.action .ic { color: var(--accent); }
.action span { display: grid; } .action strong { font-weight: 600; } .action small { color: var(--muted); font-size: 12.5px; }
.about p { color: var(--muted); font-size: 14px; }
.hint { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--soft); color: var(--muted); font-size: 13.5px; }
.err { padding: 10px 12px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-size: 14px; }
.adv { border-top: 1px solid var(--line); }
.adv > summary { font-size: 14px; color: var(--muted); }
.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 12px; background: var(--danger-soft); }

/* בודקים */
.review-hero { border-radius: 28px; padding: 24px; background: radial-gradient(120% 90% at 100% 0%, var(--blush), transparent 60%), var(--surface); box-shadow: var(--shadow); }
.review-hero > div { display: grid; gap: 10px; justify-items: start; max-width: 70ch; }
.review-hero p { color: var(--muted); }
.steps { padding-inline-start: 20px; display: grid; gap: 4px; }
.scen-list { display: grid; }
.scen { border-bottom: 1px solid var(--line); }
.scen:last-child { border-bottom: 0; }
.scen-h { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 0; border: 0; background: transparent; text-align: start; }
.scen-h strong { flex: 1; font-weight: 500; font-size: 14.5px; }
.scen-h > .ic:last-child { color: var(--faint); }
.scen.open .scen-h > .ic:last-child { transform: rotate(-90deg); }
.scen.open .scen-h strong { font-weight: 700; }
.tag { flex-shrink: 0; min-width: 76px; text-align: center; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); font-size: 11.5px; font-weight: 500; }
.scen-body { display: grid; gap: 10px; padding: 0 0 18px; }

    ["עונת חודש נוספת", "Additional Veset HaChodesh", "Vésset ha'hodech supplémentaire", "Veset HaJódesh adicional"],

    ["הפלגה · {n} עונות", "Haflagah · {n} onot", "Haflaga · {n} onot", "Haflagá · {n} onot"],

    ["לא נרשמו הפסק וטבילה אחרי הראייה האחרונה", "No hefsek or immersion recorded after the latest period", "Ni hefsek ni tevila notés après les dernières règles", "No se registraron hefsek ni tevilá después del último período"],

    ["היום העברי והעונה", "The Hebrew day and the onah", "Le jour hébraïque et l'ona", "El día hebreo y la oná"],
    ["כל רישום נשמר עם התאריך האזרחי, השעה המקומית והעיר. היום העברי מתחיל בשקיעה, ועונת היום נמשכת מהזריחה עד השקיעה.", "Each entry is stored with the civil date, local time and city. The Hebrew day begins at sunset, and the day onah lasts from sunrise to sunset.", "Chaque entrée est enregistrée avec la date civile, l'heure locale et la ville. Le jour hébraïque commence au coucher du soleil, et l'ona de jour va du lever au coucher.", "Cada entrada se guarda con la fecha civil, la hora local y la ciudad. El día hebreo empieza al ponerse el sol, y la oná de día va de la salida a la puesta del sol."],
    ["זמני השמש מחושבים בגובה פני הים. צאת הכוכבים לפי הזווית שנבחרה ({n}° או {n}°).", "Sun times are calculated at sea level. Nightfall follows the chosen angle ({n}° or {n}°).", "Les horaires solaires sont calculés au niveau de la mer. La sortie des étoiles suit l'angle choisi ({n}° ou {n}°).", "Los horarios solares se calculan a nivel del mar. La salida de las estrellas sigue el ángulo elegido ({n}° o {n}°)."],
    ["רישום בטווח שלוש דקות מהזריחה או מהשקיעה, או בין השקיעה לצאת הכוכבים, מסומן לבירור ואינו משמש לחישוב ודאי. שלוש הדקות הן סף לסימון ולא הגדרה של בין השמשות.", "An entry within three minutes of sunrise or sunset, or between sunset and nightfall, is marked for clarification and not used for a definite calculation. The three minutes are a flagging threshold, not a definition of bein hashmashot.", "Une entrée à moins de trois minutes du lever ou du coucher du soleil, ou entre le coucher et la sortie des étoiles, est signalée à clarifier et n'entre pas dans un calcul certain. Ces trois minutes sont un seuil de signalement, pas une définition de bein hachmachot.", "Una entrada a menos de tres minutos de la salida o puesta del sol, o entre la puesta y la salida de las estrellas, se marca para aclarar y no se usa en un cálculo seguro. Los tres minutos son un umbral de aviso, no una definición de bein hashmashot."],
    ["שעה כפולה או חסרה במעבר שעון, ומקום בלי זריחה או שקיעה (קוטב), אינם מסווגים אוטומטית.", "A repeated or missing hour at a clock change, and a place with no sunrise or sunset (polar), are not classified automatically.", "Une heure doublée ou manquante lors du changement d'heure, et un lieu sans lever ni coucher du soleil (polaire), ne sont pas classés automatiquement.", "Una hora repetida o inexistente en el cambio de hora, y un lugar sin salida ni puesta del sol (polar), no se clasifican automáticamente."],
    ["המתנה לפני ההפסק", "Waiting before the hefsek", "Attente avant le hefsek", "Espera antes del hefsek"],
    ["חמישה ימים: יום הראייה נספר כיום הראשון, וההפסק המוקדם ביום החמישי.", "Five days: the day of onset counts as the first day, and the earliest hefsek is on the fifth day.", "Cinq jours : le jour de l'apparition compte comme premier jour, et le hefsek le plus tôt est le cinquième jour.", "Cinco días: el día de la aparición cuenta como el primero, y el hefsek más temprano es el quinto día."],
    ["ארבעה ימים: נספרים ממועד היחסים שנרשם כבסיס, ולא מהראייה. בלי בסיס רשום אין חישוב, ומופיעה נקודה לבירור.", "Four days: counted from the recorded relations date, not from the period start. Without a recorded base there is no calculation, and a point to clarify appears.", "Quatre jours : comptés depuis la date de relation notée, pas depuis le début des règles. Sans base notée, pas de calcul, et un point à clarifier apparaît.", "Cuatro días: se cuentan desde la fecha de relación registrada, no desde el inicio del período. Sin base registrada no hay cálculo y aparece un punto a aclarar."],
    ["חידוש ספירה בתוך תקופת הנידה נשען על תחילת הנידה הקודמת ולא מוסיף חמישה ימים חדשים.", "A restart within the niddah period relies on the earlier niddah start and does not add five new days.", "Une reprise pendant la nidda s'appuie sur le début de nidda précédent et n'ajoute pas cinq nouveaux jours.", "Un reinicio dentro de la nidá se basa en el inicio de nidá anterior y no añade cinco días nuevos."],
    ["הפסק טהרה ושבעה נקיים", "Hefsek taharah and the seven clean days", "Hefsek tahara et sept jours propres", "Hefsek tahará y siete días limpios"],
    ["הספירה מתחילה רק מהפסק שנרשם כנקי, לפני השקיעה ולא בזמן מסופק, ולא לפני סוף ההמתנה. הפסק מוקדם מתקבל רק עם הוראה אישית מתועדת.", "The count starts only from a hefsek recorded as clean, before sunset and not at a doubtful time, and not before the wait ends. An early hefsek is accepted only with a documented personal ruling.", "Le décompte ne démarre que d'un hefsek noté propre, avant le coucher du soleil et pas à une heure douteuse, et pas avant la fin de l'attente. Un hefsek anticipé n'est accepté qu'avec une instruction personnelle documentée.", "El conteo solo empieza con un hefsek registrado como limpio, antes de la puesta del sol y no en hora dudosa, y no antes de terminar la espera. Un hefsek anticipado solo se acepta con una indicación personal documentada."],
    ["יום א׳ הוא היום העברי שאחרי ההפסק. ליל הטבילה המתוכנן הוא במוצאי היום השביעי, וזה נשאר תכנון בלבד.", "Day 1 is the Hebrew day after the hefsek. The planned immersion night is after the seventh day, and remains only a plan.", "Le jour 1 est le jour hébraïque qui suit le hefsek. La nuit de tevila prévue est à l'issue du septième jour, et reste une simple prévision.", "El día 1 es el día hebreo siguiente al hefsek. La noche de tevilá prevista es al terminar el séptimo día y sigue siendo solo un plan."],
    ["חוסר רישום בדיקה ביום הראשון או השביעי מסומן לבירור, ואינו פוסל או מאשר. בדיקה שנרשמה כלא נקייה אינה מאפסת אוטומטית.", "A missing bedikah record on the first or seventh day is marked for clarification; it neither invalidates nor approves. A bedikah recorded as not clean does not reset automatically.", "L'absence de bedika notée le premier ou le septième jour est signalée à clarifier ; cela n'invalide ni n'approuve. Une bedika notée non propre ne remet pas à zéro automatiquement.", "La falta de registro de bedicá el primer o séptimo día se marca para aclarar; no invalida ni aprueba. Una bedicá registrada como no limpia no reinicia automáticamente."],
    ["אותו יום בחודש העברי הבא, באותה עונה.", "The same day in the next Hebrew month, in the same onah.", "Le même jour du mois hébraïque suivant, dans la même ona.", "El mismo día del siguiente mes hebreo, en la misma oná."],
    ["ראייה בל׳ כשבחודש הבא אין ל׳: ברירת המחדל היא א׳ בחודש שאחרי החודש החסר, כפסיקת מכון נשמת. אפשר לבחור דילוג.", "A period on the 30th when the next month has no 30th: the default is the 1st of the month after the short month, as ruled by Nishmat. You can choose to skip.", "Règles le 30 quand le mois suivant n'a pas de 30 : par défaut, le 1er du mois qui suit le mois court, selon Nishmat. Vous pouvez choisir de sauter.", "Período el día 30 cuando el mes siguiente no tiene 30: por defecto, el día 1 del mes posterior al mes corto, según Nishmat. Puede elegir omitirlo."],
    ["ראתה פעמיים באותו חודש: כל החישובים נעשים מהראייה האחרונה, ובנוסף נשמרת עונת החודש של הראייה הקודמת אם עוד לא הגיעה (נשמת; לוח חב״ד).", "Two periods in the same month: all calculations use the latest period, and the Veset HaChodesh of the earlier one is also kept if it has not arrived yet (Nishmat; Chabad calendar).", "Deux fois dans le même mois : tous les calculs partent des dernières règles, et le vésset ha'hodech des précédentes est aussi gardé s'il n'est pas encore arrivé (Nishmat ; calendrier Habad).", "Dos veces en el mismo mes: todos los cálculos parten del último período, y también se mantiene el veset hajódesh del anterior si aún no llegó (Nishmat; calendario de Jabad)."],
    ["בשנה מעוברת אדר א׳ עובר לאדר ב׳.", "In a leap year, Adar I moves to Adar II.", "En année embolismique, Adar I passe à Adar II.", "En año embolismal, Adar I pasa a Adar II."],
    ["שימור עונת חודש שחלה בזמן דימום הוא אפשרות נפרדת שדורשת תיעוד מלא.", "Keeping a Veset HaChodesh that fell during bleeding is a separate option that requires full records.", "Conserver un vésset ha'hodech tombé pendant un saignement est une option distincte qui nécessite un relevé complet.", "Conservar un veset hajódesh que cayó durante un sangrado es una opción aparte que requiere registros completos."],
    ["עונה בינונית", "Onah Beinonit", "Ona beinonit", "Oná beinonit"],
    ["יום 30 בספירה כוללנית: יום הראייה הוא יום 1, כלומר 29 ימים אחריו, באותה עונה.", "Day 30, counted inclusively: the day of onset is day 1, i.e. 29 days later, in the same onah.", "Jour 30 en décompte inclusif : le jour de l'apparition est le jour 1, soit 29 jours après, dans la même ona.", "Día 30 en conteo inclusivo: el día de la aparición es el día 1, es decir, 29 días después, en la misma oná."],
    ["שתי העונות, יום 31 ואור זרוע הם שלוש הגדרות נפרדות, ואף אחת מהן אינה נבחרת לפי עדה.", "Both onot, day 31 and Or Zarua are three separate settings, and none is chosen by community automatically.", "Les deux onot, le jour 31 et le Or Zaroua sont trois réglages distincts, et aucun n'est choisi d'office selon la communauté.", "Ambas onot, el día 31 y Or Zarúa son tres ajustes separados, y ninguno se elige automáticamente por comunidad."],
    ["הפלגה", "Haflagah", "Haflaga", "Haflagá"],
    ["בשיטת הימים: ההפרש בין התאריכים העבריים של שתי הראיות ועוד 1. אותו מרווח נספר מהראייה האחרונה, באותה עונה.", "Days method: the difference between the Hebrew dates of the two periods plus 1. The same interval is counted from the latest period, in the same onah.", "Méthode des jours : l'écart entre les dates hébraïques des deux règles plus 1. Le même intervalle se compte depuis les dernières règles, dans la même ona.", "Método de días: la diferencia entre las fechas hebreas de los dos períodos más 1. El mismo intervalo se cuenta desde el último período, en la misma oná."],
    ["בשיטת חב״ד: מספר העונות מההפסק הקודם ועד הראייה הבאה. המועד החדש נספר מההפסק הנוכחי. מספר זוגי נופל ביום ואי-זוגי בלילה. הפלגה ארוכה נשמרת כשמגיעה קצרה ממנה.", "Chabad method: the number of onot from the previous hefsek to the next period. The new date is counted from the current hefsek. An even number falls by day and an odd one by night. A longer haflagah is kept when a shorter one appears.", "Méthode Habad : le nombre d'onot du hefsek précédent aux règles suivantes. La nouvelle date se compte depuis le hefsek actuel. Un nombre pair tombe de jour, un impair de nuit. Une haflaga plus longue est gardée quand une plus courte apparaît.", "Método de Jabad: el número de onot desde el hefsek anterior hasta el siguiente período. La nueva fecha se cuenta desde el hefsek actual. Un número par cae de día y uno impar de noche. Una haflagá más larga se mantiene cuando aparece una más corta."],
    ["ראייה מסופקת באמצע אינה נמחקת כדי לייצר מרווח ארוך.", "A doubtful period in between is not dropped to create a longer interval.", "Des règles douteuses entre deux ne sont pas écartées pour créer un intervalle plus long.", "Un período dudoso intermedio no se descarta para crear un intervalo más largo."],
    ["וסת קבוע", "Fixed cycle (veset kavua)", "Cycle fixe (vésset kavoua)", "Ciclo fijo (veset kavúa)"],
    ["שלוש ראיות רצופות באותו יום בחודש ובאותה עונה, או שלוש הפלגות שוות בארבע ראיות, מסומנות כדפוס אפשרי.", "Three consecutive periods on the same day of the month and onah, or three equal intervals across four periods, are marked as a possible pattern.", "Trois règles consécutives au même jour du mois et dans la même ona, ou trois intervalles égaux sur quatre règles, sont signalés comme schéma possible.", "Tres períodos seguidos el mismo día del mes y en la misma oná, o tres intervalos iguales en cuatro períodos, se marcan como posible patrón."],
    ["המערכת אינה קובעת, עוקרת או משעה וסת קבוע בעצמה.", "The app does not establish, uproot or suspend a fixed cycle by itself.", "L'application n'établit, n'annule ni ne suspend un cycle fixe d'elle-même.", "La aplicación no fija, anula ni suspende un ciclo fijo por sí misma."],
    ["במה המערכת לא מכריעה", "What the app does not decide", "Ce que l'application ne tranche pas", "Qué no decide la aplicación"],
    ["היריון, אחרי לידה, הנקה, טיפול הורמונלי, וסתות לא רגילים (דילוג, סירוג), מראות וכתמים, בדיקות שהוחסרו ומעבר קו התאריך.", "Pregnancy, postpartum, nursing, hormonal treatment, irregular cycles (skipping, alternating), colors and stains, missed bedikot and crossing the date line.", "Grossesse, après-accouchement, allaitement, traitement hormonal, cycles irréguliers (saut, alternance), couleurs et taches, bedikot manquées et passage de la ligne de changement de date.", "Embarazo, posparto, lactancia, tratamiento hormonal, ciclos irregulares (salto, alternancia), colores y manchas, bedicot omitidas y cruce de la línea de cambio de fecha."],
    ["במצבים האלה החישוב הרגיל מושעה ואפשר לרשום עונות ידניות לפי הוראה. אין במערכת זיהוי מראות ואין ״שאלת רב״ אוטומטית.", "In these cases the regular calculation is suspended and you can enter manual onot per a ruling. The app does not identify colors and has no automatic \"ask a rav\".", "Dans ces cas, le calcul habituel est suspendu et vous pouvez saisir des onot manuelles sur instruction. L'application n'identifie pas les couleurs et ne remplace pas la question au rav.", "En estos casos se suspende el cálculo habitual y puede ingresar onot manuales según indicación. La aplicación no identifica colores ni reemplaza la consulta al rav."],

    // תרחישים
    ["הפלגה בימים: ב׳ ניסן ← ל׳ ניסן", "Haflagah in days: 2 Nisan → 30 Nisan", "Haflaga en jours : 2 Nissan → 30 Nissan", "Haflagá en días: 2 Nisán → 30 Nisán"],
    ["הפלגה של 29 ימים צריכה ליפול בכ״ח אייר בעונת היום. עונה בינונית (יום 30) בכ״ט אייר. בחודש אייר אין ל׳, ולכן עונת החודש לפי ברירת המחדל היא א׳ סיון.", "A 29-day haflagah should fall on 28 Iyar in the day onah. Onah Beinonit (day 30) on 29 Iyar. Iyar has no 30th, so by default the Veset HaChodesh is 1 Sivan.", "Une haflaga de 29 jours doit tomber le 28 Iyar, ona de jour. Ona beinonit (jour 30) le 29 Iyar. Iyar n'a pas de 30, donc le vésset ha'hodech par défaut est le 1er Sivan.", "Una haflagá de 29 días debe caer el 28 de Iyar en la oná de día. Oná beinonit (día 30) el 29 de Iyar. Iyar no tiene día 30, así que por defecto el veset hajódesh es el 1 de Siván."],
    ["חמישה ימים מתחילת הנידה", "Five days from the start of niddah", "Cinq jours depuis le début de la nidda", "Cinco días desde el inicio de la nidá"],
    ["ראייה בב׳ ניסן בשעה 16:00 (לפני השקיעה). יום הראייה נספר כיום הראשון, ולכן ההפסק המוקדם הוא ביום ו׳ ניסן.", "Period on 2 Nisan at 16:00 (before sunset). The day of onset is the first day, so the earliest hefsek is on 6 Nisan.", "Règles le 2 Nissan à 16 h (avant le coucher du soleil). Le jour de l'apparition compte comme premier jour, donc le hefsek le plus tôt est le 6 Nissan.", "Período el 2 de Nisán a las 16:00 (antes de la puesta del sol). El día de la aparición es el primero, así que el hefsek más temprano es el 6 de Nisán."],
    ["ראייה אחרי השקיעה", "Period after sunset", "Règles après le coucher du soleil", "Período después de la puesta del sol"],
    ["ראייה בתאריך האזרחי של ב׳ ניסן בשעה 22:00 שייכת ללילה של ג׳ ניסן. ההפסק המוקדם הוא ז׳ ניסן. העונה הבינונית ועונת החודש בעונת לילה.", "A period on the civil date of 2 Nisan at 22:00 belongs to the night of 3 Nisan. The earliest hefsek is 7 Nisan. The Onah Beinonit and Veset HaChodesh are in the night onah.", "Des règles à la date civile du 2 Nissan à 22 h appartiennent à la nuit du 3 Nissan. Le hefsek le plus tôt est le 7 Nissan. L'ona beinonit et le vésset ha'hodech sont de nuit.", "Un período en la fecha civil del 2 de Nisán a las 22:00 pertenece a la noche del 3 de Nisán. El hefsek más temprano es el 7 de Nisán. La oná beinonit y el veset hajódesh son de noche."],
    ["בסיס ההמתנה נרשם בא׳ ניסן והראייה בג׳ ניסן. לפי שיטת ארבעה ימים ממועד היחסים ההפסק המוקדם הוא ד׳ ניסן.", "The waiting base was recorded on 1 Nisan and the period on 3 Nisan. With four days from relations, the earliest hefsek is 4 Nisan.", "La base de l'attente a été notée le 1er Nissan et les règles le 3 Nissan. Avec quatre jours depuis la relation, le hefsek le plus tôt est le 4 Nissan.", "La base de la espera se registró el 1 de Nisán y el período el 3 de Nisán. Con cuatro días desde la relación, el hefsek más temprano es el 4 de Nisán."],
    ["ספירה באמצע שבעה נקיים", "Midway through the seven clean days", "Au milieu des sept jours propres", "A mitad de los siete días limpios"],
    ["הפסק בו׳ ניסן לפני השקיעה. יום א׳ של הספירה הוא ז׳ ניסן, וההדמיה נמצאת ביום ד׳. ליל הטבילה המתוכנן הוא ליל י״ד ניסן, במוצאי יום ז׳ (י״ג ניסן). בדיקות נרשמו בימים א׳–ג׳.", "Hefsek on 6 Nisan before sunset. Day 1 of the count is 7 Nisan, and the simulation is on day 4. The planned immersion night is the night of 14 Nisan, after day 7 (13 Nisan). Bedikot were recorded on days 1–3.", "Hefsek le 6 Nissan avant le coucher du soleil. Le jour 1 du décompte est le 7 Nissan, et la simulation est au jour 4. La nuit de tevila prévue est la nuit du 14 Nissan, à l'issue du jour 7 (13 Nissan). Des bedikot ont été notées les jours 1 à 3.", "Hefsek el 6 de Nisán antes de la puesta del sol. El día 1 del conteo es el 7 de Nisán y la simulación está en el día 4. La noche de tevilá prevista es la del 14 de Nisán, al terminar el día 7 (13 de Nisán). Se registraron bedicot los días 1 a 3."],
    ["הפסק שנרשם אחרי השקיעה", "Hefsek recorded after sunset", "Hefsek noté après le coucher du soleil", "Hefsek registrado después de la puesta del sol"],
    ["הפסק בשעה 22:00 אינו פותח ספירה אוטומטית ומופיע בנקודות לבירור. המערכת נשארת במצב המתנה.", "A hefsek at 22:00 does not start a count automatically and appears among the points to clarify. The app stays in the waiting state.", "Un hefsek à 22 h ne lance pas le décompte automatiquement et apparaît dans les points à clarifier. L'application reste en attente.", "Un hefsek a las 22:00 no inicia el conteo automáticamente y aparece en los puntos a aclarar. La aplicación sigue en espera."],
    ["הפסק מוקדם עם הוראה מתועדת", "Early hefsek with a documented ruling", "Hefsek anticipé avec instruction documentée", "Hefsek anticipado con indicación documentada"],
    ["הפסק בד׳ ניסן, לפני תום חמשת הימים. נרשמה הוראה אישית, ולכן הספירה מתחילה ממנו. בלי ההוראה הייתה מופיעה נקודה לבירור. אפשר למחוק את ההוראה ברישום ולראות את ההבדל.", "Hefsek on 4 Nisan, before the five days end. A personal ruling was recorded, so the count starts from it. Without the ruling a point to clarify would appear. You can delete the ruling in the entry and see the difference.", "Hefsek le 4 Nissan, avant la fin des cinq jours. Une instruction personnelle a été notée, donc le décompte part de là. Sans elle, un point à clarifier apparaîtrait. Vous pouvez supprimer l'instruction dans l'entrée pour voir la différence.", "Hefsek el 4 de Nisán, antes de terminar los cinco días. Se registró una indicación personal, así que el conteo empieza desde ahí. Sin ella aparecería un punto a aclarar. Puede borrar la indicación en la entrada y ver la diferencia."],
    ["הוראת מורה הוראה לצורך הדגמה", "A rav's ruling, for demonstration", "Instruction d'un rav, pour la démonstration", "Indicación de un rav, para la demostración"],
    ["שיטת חב״ד: 52 עונות", "Chabad method: 52 onot", "Méthode Habad : 52 onot", "Método de Jabad: 52 onot"],
    ["מההפסק בה׳ ניסן עד הראייה בא׳ אייר (ביום) עברו 52 עונות. החשש החדש נספר מההפסק הנוכחי (ה׳ אייר): 52 עונות אחריו, כלומר ב׳ סיון בעונת היום.", "From the hefsek on 5 Nisan to the period on 1 Iyar (by day) 52 onot passed. The new date is counted from the current hefsek (5 Iyar): 52 onot later, i.e. 2 Sivan in the day onah.", "Du hefsek du 5 Nissan aux règles du 1er Iyar (de jour), 52 onot se sont écoulées. La nouvelle date se compte depuis le hefsek actuel (5 Iyar) : 52 onot plus tard, soit le 2 Sivan, ona de jour.", "Desde el hefsek del 5 de Nisán hasta el período del 1 de Iyar (de día) pasaron 52 onot. La nueva fecha se cuenta desde el hefsek actual (5 de Iyar): 52 onot después, es decir, el 2 de Siván en la oná de día."],
    ["ל׳ ניסן, וחודש אייר חסר", "30 Nisan, and Iyar has 29 days", "30 Nissan, et Iyar a 29 jours", "30 de Nisán, e Iyar tiene 29 días"],
    ["ברירת המחדל היא א׳ בחודש שאחרי החודש החסר, כפסיקת מכון נשמת (״יוצאים בזה ידי כל השיטות״, כי העונה הבינונית חלה בכ״ט אייר). עונת החודש היא א׳ סיון ולא תמוז. אפשר לשנות בהגדרות ל״דילוג״ ולראות שהמועד נעלם ונוספת נקודה לבירור.", "The default is the 1st of the month after the short month, as ruled by Nishmat (\"this satisfies all opinions\", since the Onah Beinonit falls on 29 Iyar). The Veset HaChodesh is 1 Sivan, not Tammuz. You can switch the setting to \"skip\" and see the date disappear and a point to clarify appear.", "Par défaut, le 1er du mois qui suit le mois court, selon Nishmat (« on satisfait ainsi toutes les opinions », car l'ona beinonit tombe le 29 Iyar). Le vésset ha'hodech est le 1er Sivan, pas Tamouz. Passez le réglage sur « sauter » pour voir la date disparaître et un point à clarifier apparaître.", "Por defecto, el día 1 del mes posterior al mes corto, según Nishmat («así se cumplen todas las opiniones», ya que la oná beinonit cae el 29 de Iyar). El veset hajódesh es el 1 de Siván, no Tamuz. Cambie el ajuste a «omitir» para ver cómo desaparece la fecha y aparece un punto a aclarar."],
    ["שנה מעוברת: אדר א׳ ← אדר ב׳", "Leap year: Adar I → Adar II", "Année embolismique : Adar I → Adar II", "Año embolismal: Adar I → Adar II"],
    ["ראייה בי״ב אדר א׳ תשפ״ד. עונת החודש בי״ב אדר ב׳ ולא בי״ב ניסן.", "A period on 12 Adar I 5784. The Veset HaChodesh is on 12 Adar II, not 12 Nisan.", "Règles le 12 Adar I 5784. Le vésset ha'hodech est le 12 Adar II, pas le 12 Nissan.", "Período el 12 de Adar I de 5784. El veset hajódesh es el 12 de Adar II, no el 12 de Nisán."],
    ["יום 31, שתי עונות ואור זרוע", "Day 31, both onot and Or Zarua", "Jour 31, deux onot et Or Zaroua", "Día 31, ambas onot y Or Zarúa"],
    ["בהפעלת שלוש האפשרויות: עונה בינונית ביום 30 וביום 31, בשתי העונות, ולכל חשש גם עונת אור זרוע שלפניו. כל אפשרות נשלטת בנפרד בהגדרות.", "With all three options on: Onah Beinonit on days 30 and 31, in both onot, and an Or Zarua onah before each date. Each option is controlled separately in settings.", "Avec les trois options : ona beinonit aux jours 30 et 31, dans les deux onot, et une ona de Or Zaroua avant chaque date. Chaque option se règle séparément.", "Con las tres opciones: oná beinonit los días 30 y 31, en ambas onot, y una oná de Or Zarúa antes de cada fecha. Cada opción se controla por separado."],
    ["כתם מסופק באמצע", "A doubtful stain in between", "Une tache douteuse entre deux", "Una mancha dudosa intermedia"],
    ["ראייה מסופקת בט״ו ניסן אינה נמחקת כדי לייצר הפלגה ארוכה. לא מחושבת הפלגה, ומופיעה נקודה לבירור.", "A doubtful period on 15 Nisan is not dropped to create a longer haflagah. No haflagah is calculated, and a point to clarify appears.", "Des règles douteuses le 15 Nissan ne sont pas écartées pour créer une haflaga plus longue. Aucune haflaga n'est calculée, et un point à clarifier apparaît.", "Un período dudoso el 15 de Nisán no se descarta para crear una haflagá más larga. No se calcula haflagá y aparece un punto a aclarar."],
    ["מראה לא ברור — נשאל", "Unclear color — asked a rav", "Couleur incertaine — question posée", "Color dudoso — se consultó"],
    ["ראתה פעמיים באותו חודש", "Two periods in the same month", "Deux fois dans le même mois", "Dos veces en el mismo mes"],
    ["ראייה בה׳ ניסן, הפסק, וראייה נוספת בכ״ה ניסן. כל החישובים (הפלגה, עונה בינונית, עונת החודש) נעשים מכ״ה ניסן, ובנוסף נשמרת עונת חודש מה׳ ניסן: ה׳ אייר. כך עונה מכון נשמת לשאלה על שתי ראיות בהפרש קצר, וכך גם לוח חב״ד.", "A period on 5 Nisan, a hefsek, and another period on 25 Nisan. All calculations (haflagah, Onah Beinonit, Veset HaChodesh) use 25 Nisan, and the Veset HaChodesh from 5 Nisan is also kept: 5 Iyar. This is how Nishmat answers a question about two periods close together, as does the Chabad calendar.", "Règles le 5 Nissan, un hefsek, puis de nouvelles règles le 25 Nissan. Tous les calculs (haflaga, ona beinonit, vésset ha'hodech) partent du 25 Nissan, et le vésset ha'hodech du 5 Nissan est aussi gardé : le 5 Iyar. C'est la réponse de Nishmat pour deux règles rapprochées, comme le calendrier Habad.", "Período el 5 de Nisán, un hefsek y otro período el 25 de Nisán. Todos los cálculos (haflagá, oná beinonit, veset hajódesh) parten del 25 de Nisán, y también se mantiene el veset hajódesh del 5 de Nisán: el 5 de Iyar. Así responde Nishmat sobre dos períodos cercanos, igual que el calendario de Jabad."],
    ["שלוש ראיות בי׳ לחודש", "Three periods on the 10th of the month", "Trois règles le 10 du mois", "Tres períodos el día 10 del mes"],
    ["שלוש ראיות רצופות בי׳ ניסן, אייר וסיון באותה עונה. המערכת מסמנת ״דפוס חודשי אפשרי״ לבירור ואינה קובעת וסת קבוע בעצמה.", "Three consecutive periods on 10 Nisan, Iyar and Sivan in the same onah. The app flags a \"possible monthly pattern\" for clarification and does not establish a fixed cycle by itself.", "Trois règles consécutives le 10 Nissan, Iyar et Sivan dans la même ona. L'application signale un « schéma mensuel possible » à clarifier et n'établit pas de cycle fixe elle-même.", "Tres períodos seguidos el 10 de Nisán, Iyar y Siván en la misma oná. La aplicación marca un «posible patrón mensual» para aclarar y no fija un ciclo fijo por sí misma."],
    ["נסיעה לפריז בזמן עונה", "Trip to Paris during an onah", "Voyage à Paris pendant une ona", "Viaje a París durante una oná"],
    ["הראייה נרשמה בנתניה. בזמן העונה הבינונית יש נסיעה לפריז, ולכן העונה מחושבת לפי השקיעה והזריחה בפריז, בלי לשנות את מקום הרישום המקורי.", "The period was recorded in Netanya. During the Onah Beinonit there is a trip to Paris, so the onah is calculated by sunset and sunrise in Paris, without changing the place of the original entry.", "Les règles ont été notées à Netanya. Pendant l'ona beinonit il y a un voyage à Paris, l'ona est donc calculée selon le coucher et le lever du soleil à Paris, sans changer le lieu de l'entrée initiale.", "El período se registró en Netanya. Durante la oná beinonit hay un viaje a París, así que la oná se calcula según la puesta y salida del sol en París, sin cambiar el lugar de la entrada original."],

  const I = (n, s = 20) => `<svg class="ic${n === "left" || n === "right" || n === "out" ? " dirflip" : ""}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

  const planHebrew = p => p.onah === "day" ? hebrew(p.date) : hebrew(addDays(p.date, 1));
  const onahLabel = o => o === "day" ? "עונת יום" : o === "night" ? "עונת לילה" : "ערב";
  const SEP_KINDS = ["monthly", "interval", "average", "or-zarua", "manual"];

  function planLine(p, { compact = false, open = false } = {}) {

  /* ---------- מסכים ---------- */
  function viewToday(st, r, ctx) {

      immersed: ["טבילה נרשמה", "המועדים הקרובים מופיעים למטה ובלוח השנה.", "רישום חדש", "note"],

  function viewCalendar(st, r, ctx) {
    const c = app.cal; c.cursor ||= ctx.date; c.selected ||= ctx.date;
    let first, next;
    if (c.mode === "hebrew") { const h = hd(c.cursor); const f = new HDate(1, h.getMonth(), h.getFullYear()); first = fromAbs(f.abs()); next = fromAbs(f.add(1, "M").abs()); }
    else { const d = fromISO(c.cursor); first = toISO(new Date(d.getFullYear(), d.getMonth(), 1, 12)); next = toISO(new Date(d.getFullYear(), d.getMonth() + 1, 1, 12)); }
    const offset = fromISO(first).getDay(), len = M.isoAbs(next) - M.isoAbs(first);
    const start = addDays(first, -offset), cells = Math.ceil((offset + len) / 7) * 7;
    const hef = r.hefsek ? M.isoAbs(r.hefsek.date) : null;
    const title = c.mode === "hebrew" ? hebMonthTitle(first) : civilMonthTitle(first);

      const out = d < first || d >= next, abs = M.isoAbs(d), clean = hef !== null && abs > hef && abs <= hef + 7;

      <p class="fine">התאריך העברי במשבצת שייך לשעות היום. בשקיעה מתחיל התאריך העברי הבא.</p>

      <button class="btn ghost full" data-act="add" data-date="${sel}">${I("plus", 17)}רישום ליום הזה</button></section></div>`;
  }
  function entryRow(e) {

    try { const s = M.stamp(e); h = s.hebrewDate; onah = s.onah === "day" ? "יום" : "לילה"; } catch { /* מסומן לבירור */ }

  function viewJournal(st, r) {

    <section class="card"><div class="card-h">${I("book")}<h3>רישומים <span class="count">${st.events.length}</span></h3><button class="link" data-act="report">${I("file", 15)}דוח לבירור</button></div>

      ${sel("haflagah", "שיטת חישוב ההפלגה", s, [["days", "ימים בין תחילות הווסתות"], ["chabad-onot", "עונות מהפסק טהרה — חב״ד"]])}
      ${sel("beinonit", "עונה בינונית ביום 30", s, [["same", "אותה עונה שבה התחילה הווסת"], ["both", "שתי העונות — לילה ויום"]])}

      <p class="fine">במצב מיוחד החישובים הרגילים מושעים, ואפשר לרשום עונות לפי הוראה.</p>
      <label class="field" for="s-methodNote">ממי ההנחיות<textarea id="s-methodNote" name="methodNote" rows="2" maxlength="1000" placeholder="שם מורה ההוראה או המנהג">${esc(s.methodNote)}</textarea></label></section>
    <section class="card"><div class="card-h">${I("bell")}<div><h3>תזכורות</h3></div></div>
      ${tog("remindersEnabled", "התראות כשהיומן פתוח", "דורש הרשאה מהדפדפן", s)}${tog("neutralReminders", "נוסח דיסקרטי", "״תזכורת אישית״ בלי פירוט", s)}

      <label class="field" for="s-morningTime">שעת בדיקת בוקר<input id="s-morningTime" name="morningTime" type="time" value="${s.morningTime}"></label></div></section>`;
  const sel = (name, label, s, opts) => `<label class="field" for="s-${name}">${label}<select id="s-${name}" name="${name}">${opts.map(([v, t]) => `<option value="${v}"${s[name] === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const tog = (name, label, detail, s) => `<label class="toggle" for="s-${name}"><span><strong>${label}</strong><small>${detail}</small></span><input id="s-${name}" name="${name}" type="checkbox" role="switch"${s[name] ? " checked" : ""}></label>`;

  function viewPrefs(st) {
    const where = app.mode === "personal" ? "היומן האישי" : app.mode === "scenario" ? "התרחיש הפתוח בלבד" : "היומן לדוגמה בלבד";

    <aside class="stack">
      <section class="card"><div class="card-h">${I("pin")}<div><h3>נסיעות</h3><p>זמני המועדים לפי היעד</p></div></div>
        ${st.trips.map(t => `<div class="trip"><span><strong>${esc(city(t.cityId).name)}</strong><small dir="ltr">${t.from} — ${t.to}</small></span><button class="icon-btn" data-deltrip="${t.id}" aria-label="מחיקת נסיעה">${I("trash", 17)}</button></div>`).join("")}

      <section class="card about"><div class="card-h">${I("droplet")}<div><h3>על מעיין</h3><p>גרסה ${APP_VERSION} · מנוע ${M.ENGINE_VERSION}</p></div></div>
        <p>האפליקציה חינמית ופועלת כולה בטלפון, בלי חשבון ובלי שרת. שום מידע לא נשלח לאף אחד.</p>
        ${NATIVE ? "" : `<p>להתקנה: בתפריט הדפדפן (⋮) בוחרים ״הוספה למסך הבית״.</p><a class="link" href="https://github.com/nrt613/maayan/releases/latest/download/maayan.apk" target="_blank" rel="noopener">${I("download", 15)}אפליקציית אנדרואיד עם התראות</a>`}
        <button class="link" data-act="terms">${I("file", 15)}תנאי שימוש ופרטיות</button></section>
    </aside></div>`;

  /* ---------- מסך הבודקים ---------- */
  function viewReview(st) {
    const res = app.testResults, passed = res && res.filter(t => t.ok).length;
    const groups = res ? [...new Set(res.map(t => t.group))] : [];
    return `<section class="review-hero"><div>
        <span class="chip-light">גרסת בדיקה ${APP_VERSION}</span><h2>הנחיות לבודקים</h2>
        <p>תודה על הבדיקה. המטרה היא לוודא שכל כלל מחושב כמו שצריך לפי השיטה שנבחרה, ושהמערכת לא מכריעה במקום שבו צריך לשאול.</p>
        <ol class="steps"><li>פותחים תרחיש מוכן, רואים מה הוזן ומה חושב, ומשווים להלכה.</li><li>אפשר לפתוח תרחיש ביומן המלא, לשנות רישומים והגדרות ולראות את החישוב משתנה.</li><li>מעתיקים דוח ושולחים למפתח עם ההערות.</li></ol>
      </div></section>
      <section class="card"><div class="card-h">${I("flask")}<div><h3>תרחישים מוכנים <span class="count">${SCENARIOS.length}</span></h3><p>כל תרחיש רץ בזמן מדומה ואינו נוגע ביומן האישי</p></div></div>
        <div class="scen-list">${SCENARIOS.map(scenarioCard).join("")}</div></section>
      <div class="two">
      <section class="card"><div class="card-h">${I("shield")}<div><h3>בדיקות אוטומטיות</h3><p>${res ? `${passed} מתוך ${res.length} עברו` : `${MaayanTests(M).tests.length} בדיקות של מנוע החישוב`}</p></div>
        <button class="btn ghost sm" data-act="tests">${I(res ? "refresh" : "play", 16)}${res ? "הרצה חוזרת" : "הרצה"}</button></div>
        ${res ? `<div class="test-sum ${passed === res.length ? "good" : "bad"}">${passed === res.length ? I("check", 18) + "כל הבדיקות עברו במכשיר הזה" : I("x", 18) + `${res.length - passed} בדיקות נכשלו`}</div>
          ${groups.map(g => `<details class="tgroup"><summary>${esc(g)} <span class="count">${res.filter(t => t.group === g && t.ok).length}/${res.filter(t => t.group === g).length}</span>${I("left", 15)}</summary><ul>${res.filter(t => t.group === g).map(t => `<li class="${t.ok ? "ok" : "no"}">${I(t.ok ? "check" : "x", 15)}<span>${esc(t.name)}${t.ok ? "" : `<small>${esc(t.error)}</small>`}</span></li>`).join("")}</ul></details>`).join("")}`
          : `<p>הבדיקות מוודאות את הלוח העברי, זמני השמש ואת כל כללי החישוב מול דוגמאות קבועות, כולל הדוגמה של מכון נשמת (ב׳ ניסן ← ל׳ ניסן ← כ״ח אייר).</p>`}
      </section>
      <section class="card"><div class="card-h">${I("copy")}<div><h3>שליחת הערות</h3><p>דוח עם ההגדרות, הרישומים והתוצאות</p></div></div>

        <button class="btn full" data-act="review-report">${I("copy", 17)}העתקת הדוח</button>
        <p class="fine">הדוח כולל את היומן שפתוח עכשיו (${app.mode === "personal" ? "היומן האישי" : app.mode === "scenario" ? "התרחיש" : "יומן הדוגמה"}). אחרי ההעתקה מדביקים בוואטסאפ או במייל.</p></section>
      </div>
      <section class="card"><div class="card-h">${I("book")}<div><h3>כללי החישוב ומקורותיהם</h3><p>מה המערכת עושה, ובמה היא לא מכריעה</p></div></div><div class="rules">${RULES.map(rl => `<details><summary>${esc(rl.t)}${I("left", 15)}</summary>${rl.p.map(x => `<p>${esc(x)}</p>`).join("")}${rl.src ? `<a href="${rl.src}" target="_blank" rel="noopener">מקור ${I("out", 13)}</a>` : ""}</details>`).join("")}</div></section>`;
  }
  function scenarioCard(sc) {
    const open = app.openScenario === sc.id;
    let body = "";
    if (open) {
      const { state: s, now: n } = sc.build(), r = calculate(s, n), ctx = currentContext(s, n);
      const plans = r.plans.filter(p => p.kind !== "bedikah"), bed = r.plans.filter(p => p.kind === "bedikah");
      body = `<div class="scen-body">
        <div class="expect"><strong>מה לבדוק</strong><p>${esc(sc.check)}</p></div>
        <p class="sim">זמן ההדמיה: <span class="hebdate">${esc(ctx.hebrewDate)}</span> · ${esc(civilLabel(ctx.date))} · ${esc(ctx.time)} · ${esc(ctx.city.name)}</p>
        ${diffSettings(s.settings)}
        <h4>מה הוזן</h4><ul class="inputs">${M.sorted(s.events).map(e => `<li>${esc(M.eventLine(e).split("\n")[0].split(" | ").slice(1).join(" · "))}</li>`).join("")}${s.trips.map(t => `<li>נסיעה ל${esc(city(t.cityId).name)}: ${esc(hebrew(t.from))} עד ${esc(hebrew(t.to))}</li>`).join("")}</ul>
        <h4>מה חושב</h4><p class="phase">מצב: <strong>${esc(PHASE_NAMES[r.phase])}</strong>${r.earliestHefsek && r.phase === "waiting" ? ` · הפסק מוקדם: <span class="hebdate">${esc(hebrew(r.earliestHefsek))}</span>` : ""}${r.phase === "clean" ? ` · יום ${r.cleanDay} מתוך 7` : ""}</p>
        <div class="plans">${plans.map(p => planLine(p)).join("") || '<p class="empty">אין מועדים מחושבים.</p>'}</div>
        ${bed.length ? `<p class="fine">ועוד ${bed.length} תזכורות לבדיקות בשבעה נקיים (מופיעות ביומן המלא).</p>` : ""}
        ${r.reviews.length ? `<h4>נקודות לבירור</h4><ul class="rv">${r.reviews.map(v => `<li><strong>${esc(v.title)}</strong> — ${esc(v.detail)}</li>`).join("")}</ul>` : ""}
        <button class="btn full" data-scenario-load="${sc.id}">${I("play", 16)}פתיחה ביומן המלא</button></div>`;
    }
    return `<article class="scen${open ? " open" : ""}"><button class="scen-h" data-scenario="${sc.id}" aria-expanded="${open}"><span class="tag">${esc(sc.tag)}</span><strong>${esc(sc.title)}</strong>${I("left", 16)}</button>${body}</article>`;
  }
  const PHASE_NAMES = { empty: "אין רישומים", waiting: "ממתינה להפסק", clean: "שבעה נקיים", planned: "מועד הטבילה עבר", immersed: "אחרי טבילה" };
  function diffSettings(s) {
    const d = M.SETTING_DEFAULTS, keys = ["wait", "haflagah", "beinonit", "day31", "orZarua", "carryMonthly", "carryLongIntervals", "missingMonthly"];
    const changed = keys.filter(k => s[k] !== d[k]);
    if (!changed.length) return `<p class="fine">הגדרות ברירת המחדל: חמישה ימים, הפלגה בימים, עונה בינונית באותה עונה.</p>`;
    return `<p class="fine">הגדרות התרחיש: ${changed.map(k => esc(M.settingsSummary(s).find(x => x.startsWith({ wait: "המתנה", haflagah: "הפלגה", beinonit: "עונה בינונית", day31: "יום 31", orZarua: "אור זרוע", carryMonthly: "שימור עונת", carryLongIntervals: "שימור הפלגות", missingMonthly: "יום ל׳" }[k])))).join(" · ")}</p>`;
  }
  const TERMS = [
    { t: "מה זה מעיין", p: ["מעיין היא כלי עזר אישי לרישום ולתכנון בענייני טהרת המשפחה. היא אינה פוסקת הלכה, אינה מורה הוראה ואינה ייעוץ רפואי.", "האפליקציה ניתנת בחינם, לשימוש אישי."] },

  const S = M.SOURCES;
  const RULES = [
    { t: "היום העברי והעונה", p: ["כל רישום נשמר עם התאריך האזרחי, השעה המקומית והעיר. היום העברי מתחיל בשקיעה, ועונת היום נמשכת מהזריחה עד השקיעה.", "זמני השמש מחושבים בגובה פני הים. צאת הכוכבים לפי הזווית שנבחרה (8.5° או 7.083°).", "השקיעה מעוגלת לדקה כלפי מטה וצאת הכוכבים כלפי מעלה, לחומרא. החישוב נבדק מול ״שקיעה במישור״ בלוח עיתים לבינה ונמצא תואם בטווח של שניות. שקיעה נראית, שמושפעת מהרים ומבניינים בסביבה, אינה מחושבת.", "רישום בטווח שלוש דקות מהזריחה או מהשקיעה, או בין השקיעה לצאת הכוכבים, מסומן לבירור ואינו משמש לחישוב ודאי. שלוש הדקות הן סף לסימון ולא הגדרה של בין השמשות.", "שעה כפולה או חסרה במעבר שעון, ומקום בלי זריחה או שקיעה (קוטב), אינם מסווגים אוטומטית."], src: S.calendar },

        app.modal = { kind: "confirm", title: "להחליף את היומן?", text: `היומן הנוכחי יוחלף בגרסה מהגיבוי (${restored.events.length} רישומים).`, yes: "שחזור", run: () => { app.blockSave = false; app.loadWarning = ""; commit(restored); } };
        renderModal();
      } catch (err) { app.modal.error = err.message; renderModal(); }
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && app.modal) { if (app.modal.kind === "welcome") markSeen(); app.modal = null; renderModal(); } });
  function markSeen() { storage.set(SEEN_KEY, "1"); }

  /* ---------- זיהוי מיקום ---------- */
  function webLocation(gps) {
    if (!navigator.geolocation) return Promise.reject(new Error("הדפדפן הזה אינו תומך בזיהוי מיקום. אפשר לבחור עיר מהרשימה."));
    return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, () => rej(new Error(gps ? "לא ניתן לזהות מיקום כרגע. אפשר לנסות שוב במקום פתוח, או לבחור עיר מהרשימה." : "לא ניתן לזהות מיקום כאן. יש לאשר הרשאת מיקום בדפדפן, או לבחור עיר מהרשימה.")), { enableHighAccuracy: gps, timeout: 30000, maximumAge: 600000 }));
  }
  async function detectLocation(btn) {
    if (btn) btn.disabled = true;
    toast("מזהה מיקום…");
    try {
      let pos;
      if (NATIVE && PL.Geolocation) {
        const perm = await PL.Geolocation.requestPermissions();
        if (perm.location !== "granted" && perm.coarseLocation !== "granted") throw new Error("לא ניתנה הרשאת מיקום. אפשר לאשר בהגדרות המכשיר, או לבחור עיר מהרשימה.");
        // קודם שירות המיקום של Google; אם אינו זמין (למשל במכשיר בלי שירותי Google) — ה-GPS של המכשיר
        try { pos = await Promise.race([PL.Geolocation.getCurrentPosition({ enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))]); }
        catch { pos = await webLocation(true); }
      } else pos = await webLocation(false);
      const lat = Math.round(pos.coords.latitude * 1e4) / 1e4, lon = Math.round(pos.coords.longitude * 1e4) / 1e4;
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
      const dist = c => { const R = Math.PI / 180, x = (c.lon - lon) * R * Math.cos((c.lat + lat) / 2 * R), y = (c.lat - lat) * R; return Math.sqrt(x * x + y * y) * 6371; };
      const near = [...CITIES].sort((a, b) => dist(a) - dist(b))[0], close = dist(near) <= 25;
      app.toast = "";
      app.modal = { kind: "place", lat, lon, tz, near: close ? near.name : "", name: L.t(close ? `ליד ${near.name}` : "המיקום שלי"), error: "" };
      renderModal(); renderToast();
    } catch (err) { toast(err && err.message && /[\u0590-\u05FF]/.test(err.message) ? err.message : "לא ניתן לזהות מיקום כרגע. אפשר לנסות שוב במקום פתוח, או לבחור עיר מהרשימה."); }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  }

  /* ---------- התראות מתוזמנות (אפליקציית אנדרואיד) ---------- */
  const hashId = str => { let h = 7; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; };
  let syncing = Promise.resolve();
  function syncNotifications() { syncing = syncing.then(doSync, doSync); return syncing; }
  async function doSync() {
    if (!NATIVE || !PL.LocalNotifications) return;
    const LN = PL.LocalNotifications;
    try {
      const perm = await LN.checkPermissions();
      app.permission = perm.display === "granted" ? "granted" : perm.display === "denied" ? "denied" : "default";
      try { const ex = await LN.checkExactNotificationSetting(); app.exact = ex.exact_alarm === "granted"; } catch { app.exact = null; }
      const pending = await LN.getPending();
      if (pending.notifications.length) await LN.cancel({ notifications: pending.notifications.map(x => ({ id: x.id })) });
      app.scheduled = 0;
      const st = app.personal;
      if (app.permission !== "granted" || !st.settings.remindersEnabled) return;
      await LN.createChannel({ id: "maayan", name: L.t("תזכורות"), description: L.t("תזכורות אישיות מהיומן"), importance: 4, visibility: 0 });
      const n = new Date(), r = calculate(st, n), neutral = st.settings.neutralReminders;
      const list = r.plans.filter(p => !p.done && new Date(p.start) > n).slice(0, 60).map(p => ({
        id: hashId(p.id), channelId: "maayan",
        title: L.t(neutral ? "תזכורת אישית" : p.title),
        body: neutral ? L.t("פרטים ביומן האישי") : `${p.onah === "day" ? planHebrew(p) : L.t(`ליל ${planHebrew(p)}`)} · ${L.t(onahLabel(p.onah))}`,
        schedule: { at: new Date(p.start), allowWhileIdle: true },
      }));
      if (list.length) await LN.schedule({ notifications: list });
      app.scheduled = list.length;
    } catch (err) { console.warn("notifications", err); }
  }

  /* ---------- שעון והתראות ---------- */
  function tick() {
    if (app.mode === "scenario") return;
    const st = state(), n = now(), r = calculate(st, n), ctx = currentContext(st, n);
    if (!NATIVE && app.permission === "granted" && st.settings.remindersEnabled && app.mode === "personal") {
      for (const p of r.plans) {
        const delta = n - new Date(p.start);
        if (p.done || delta < 0 || delta > 90000 || app.notified.has(p.id)) continue;
        app.notified.add(p.id);
        try { new Notification(L.t(st.settings.neutralReminders ? "תזכורת אישית" : p.title), { body: L.t("פרטים ביומן האישי"), tag: p.id }); } catch { /* */ }
      }
    }
    if (`${ctx.abs}|${r.phase}|${app.mode}` !== app.lastDayKey && !app.modal) render();
  }

  /* ---------- הפעלה ---------- */
  {
    const saved = storage.get(LANG_KEY), nav = (navigator.language || "he").slice(0, 2).toLowerCase();
    applyLang(saved || (L.LANGS[nav] ? nav : (nav === "iw" ? "he" : "en")), false);
  }
  app.personal = loadPersonal();
  if (NATIVE) app.permission = "default"; else if ("Notification" in window) app.permission = Notification.permission; else app.permission = "unsupported";
  const hash = location.hash.slice(1);
  if (NAV.some(n => n[0] === hash)) app.tab = hash;
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (NAV.some(n => n[0] === h) && h !== app.tab) go(h); });
  render();
  if (!storage.get(SEEN_KEY) && !app.personal.events.length) { app.modal = { kind: "welcome" }; renderModal(); }
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); if (NATIVE) syncNotifications().then(() => { if (app.tab === "dates" && !app.modal) render(); }); } });
  if (NATIVE && PL.App) PL.App.addListener("backButton", () => {
    if (app.modal) { if (app.modal.kind === "welcome") markSeen(); app.modal = null; renderModal(); }
    else if (app.tab !== "today") go("today");
    else PL.App.minimizeApp();
  });
  if (NATIVE) syncNotifications().then(() => { if (app.tab === "dates" && !app.modal) render(); });
  // אתר: התקנה למסך הבית ועבודה בלי רשת
  if (!NATIVE && "serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body></html>
