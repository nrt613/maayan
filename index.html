    ["ההגדרות נשמרות. אפשר לבטל מיד אחרי המחיקה", "Settings are kept. You can undo right after deleting", "Les réglages sont conservés. Vous pouvez annuler juste après", "Los ajustes se conservan. Puede deshacer justo después"],
    ["לבודקים הלכתיים", "For halachic reviewers", "Pour les relecteurs halakhiques", "Para revisores halájicos"],
    ["תרחישים מוכנים, בדיקות אוטומטיות וכללי החישוב", "Ready scenarios, automated tests and calculation rules", "Scénarios prêts, tests automatiques et règles de calcul", "Escenarios listos, pruebas automáticas y reglas de cálculo"],
    ["מסך הבודקים", "Reviewer screen", "Écran des relecteurs", "Pantalla de revisores"],
    ["כל שינוי נשמר מיד ויחול על היומן האישי", "Every change is saved immediately and applies to your personal diary", "Chaque modification est enregistrée aussitôt et s'applique à votre journal personnel", "Cada cambio se guarda al instante y se aplica a su diario personal"],
    ["כל שינוי נשמר מיד ויחול על היומן לדוגמה בלבד", "Every change is saved immediately and applies to the sample diary only", "Chaque modification est enregistrée aussitôt et s'applique au journal d'exemple uniquement", "Cada cambio se guarda al instante y se aplica solo al diario de ejemplo"],
    ["כל שינוי נשמר מיד ויחול על התרחיש הפתוח בלבד", "Every change is saved immediately and applies to the open scenario only", "Chaque modification est enregistrée aussitôt et s'applique au scénario ouvert uniquement", "Cada cambio se guarda al instante y se aplica solo al escenario abierto"],
    ["האפליקציה אינה שולחת מידע לשום שרת. באתר, הדף והגופנים נטענים מהאתר עצמו; באפליקציה המותקנת אין שום פנייה לרשת.", "The app sends no information to any server. On the website, the page and fonts load from the site itself; the installed app makes no network requests at all.", "L'application n'envoie aucune information à aucun serveur. Sur le site, la page et les polices sont chargées depuis le site lui-même ; l'application installée ne fait aucune requête réseau.", "La aplicación no envía información a ningún servidor. En el sitio web, la página y las fuentes se cargan desde el propio sitio; la aplicación instalada no hace ninguna solicitud de red."],
    ["היום השביעי חל בשבת", "The seventh day falls on Shabbat", "Le septième jour tombe un Chabbat", "El séptimo día cae en Shabat"],
    ["הטבילה במוצאי שבת: את ההכנות שאינן מותרות בשבת עושים ביום שישי או במוצאי שבת. יש לברר את סדר ההכנות.", "Immersion on Saturday night: preparations not permitted on Shabbat are done on Friday or on Saturday night. The order of preparations should be clarified.", "Tevila le samedi soir : les préparatifs interdits le Chabbat se font le vendredi ou le samedi soir. L'ordre des préparatifs est à clarifier.", "Tevilá el sábado por la noche: los preparativos no permitidos en Shabat se hacen el viernes o el sábado por la noche. Hay que consultar el orden de los preparativos."],
    ["אין עדיין רישומים", "No entries yet", "Aucune entrée pour l'instant", "Aún no hay registros"],
    ["כל רישום — וסת, הפסק, בדיקה או טבילה — יופיע כאן, מהחדש לישן.", "Every entry — period, hefsek, bedika or immersion — will appear here, newest first.", "Chaque entrée — règles, hefsek, bedika ou tevila — apparaîtra ici, de la plus récente à la plus ancienne.", "Cada registro — menstruación, hefsek, bedika o tevilá — aparecerá aquí, del más reciente al más antiguo."],
    ["אין מועדים עתידיים כרגע", "No upcoming dates right now", "Aucune date à venir pour le moment", "No hay fechas próximas por ahora"],
    ["מועדים חדשים יחושבו מהרישומים הבאים.", "New dates will be calculated from your next entries.", "De nouvelles dates seront calculées à partir de vos prochaines entrées.", "Las nuevas fechas se calcularán a partir de sus próximos registros."],
    ["אחרי רישום תחילת וסת יופיעו כאן עונות הפרישה, ההפסק והבדיקות.", "After recording a period start, separation times, hefsek and bedikot will appear here.", "Après l'enregistrement d'un début de règles, les temps de séparation, le hefsek et les bedikot apparaîtront ici.", "Tras registrar el inicio de la menstruación, aquí aparecerán los tiempos de separación, el hefsek y las bedikot."],

    ["לבחור לפי ההנחיה שקיבלת. אפשר לשנות בכל עת", "Choose according to the guidance you received. You can change it at any time", "À choisir selon les directives reçues. Modifiable à tout moment", "Elija según la indicación que recibió. Puede cambiarlo en cualquier momento"],

    ["העונה שלפני כל עונת פרישה — לפי הוראת הרב. כבויה כברירת מחדל.", "The onah before each separation time — per your rabbi's ruling. Off by default.", "L'ona qui précède chaque temps de séparation — selon la décision du rav. Désactivée par défaut.", "La oná anterior a cada tiempo de separación — según la indicación del rabino. Desactivada por defecto."],

    // נקודות לבירור חדשות במנוע 0.2.1
    ["ליל הטבילה חל ביום הכיפורים או בתשעה באב", "Immersion night falls on Yom Kippur or Tisha B'Av", "La nuit de la tevila tombe à Yom Kippour ou à Tisha Beav", "La noche de la tevilá cae en Yom Kipur o Tishá BeAv"],
    ["בלילות אלה אין טובלים, והטבילה נדחית. יש לברר עם רב את המועד ואת סדר ההכנות.", "There is no immersion on these nights, and it is postponed. Consult a rabbi about the date and the order of preparations.", "On ne se trempe pas ces nuits-là ; la tevila est reportée. Consultez un rav sur la date et l'ordre des préparatifs.", "En estas noches no se hace la tevilá y se pospone. Consulte a un rabino sobre la fecha y el orden de los preparativos."],
    ["ליל הטבילה חל בליל שבת", "Immersion night falls on Friday night", "La nuit de la tevila tombe un vendredi soir", "La noche de la tevilá cae el viernes por la noche"],
    ["ההכנות (רחצה, חפיפה, ציפורניים) נעשות לפני כניסת השבת, ויש הלכות מיוחדות לטבילה בשבת. יש לברר עם רב ועם המקווה.", "Preparations (bathing, hair washing, nails) are done before Shabbat begins, and there are special laws for immersion on Shabbat. Consult a rabbi and the mikveh.", "Les préparatifs (bain, lavage des cheveux, ongles) se font avant l'entrée du Chabbat, et la tevila le Chabbat obéit à des règles particulières. Consultez un rav et le mikvé.", "Los preparativos (baño, lavado del cabello, uñas) se hacen antes de que empiece Shabat, y hay leyes especiales para la tevilá en Shabat. Consulte a un rabino y a la mikvé."],
    ["ליל הטבילה חל ביום טוב", "Immersion night falls on Yom Tov", "La nuit de la tevila tombe un Yom Tov", "La noche de la tevilá cae en Yom Tov"],
    ["ליל הטבילה חל ביום טוב (כולל יום טוב שני של גלויות)", "Immersion night falls on Yom Tov (including the second day of Yom Tov in the Diaspora)", "La nuit de la tevila tombe un Yom Tov (y compris le second jour de Yom Tov en diaspora)", "La noche de la tevilá cae en Yom Tov (incluido el segundo día de Yom Tov en la diáspora)"],
    ["ההכנות נעשות לפני כניסת החג, ויש הלכות מיוחדות לטבילה ביום טוב. יש לברר עם רב ועם המקווה.", "Preparations are done before the festival begins, and there are special laws for immersion on Yom Tov. Consult a rabbi and the mikveh.", "Les préparatifs se font avant l'entrée de la fête, et la tevila un Yom Tov obéit à des règles particulières. Consultez un rav et le mikvé.", "Los preparativos se hacen antes de que empiece la festividad, y hay leyes especiales para la tevilá en Yom Tov. Consulte a un rabino y a la mikvé."],
    ["היום השביעי חל ביום טוב או בצום", "The seventh day falls on Yom Tov or a fast day", "Le septième jour tombe un Yom Tov ou un jour de jeûne", "El séptimo día cae en Yom Tov o en un ayuno"],
    ["ההכנות לטבילה במוצאי היום מוגבלות ביום עצמו. יש לברר את סדר ההכנות עם רב.", "Preparations for that evening's immersion are restricted on the day itself. Consult a rabbi about the order of preparations.", "Les préparatifs de la tevila du soir sont limités ce jour-là. Consultez un rav sur l'ordre des préparatifs.", "Los preparativos para la tevilá de esa noche están limitados ese mismo día. Consulte a un rabino sobre el orden de los preparativos."],
    ["הפסק שנרשם בלילה", "Hefsek recorded at night", "Hefsek enregistré la nuit", "Hefsek registrado de noche"],
    ["ההפסק נרשם לפני הזריחה. המערכת מונה את הספירה מהיום שלמחרת, אך הפסק נעשה בדרך כלל ביום סמוך לשקיעה; יש לוודא את הזמן ולברר.", "The hefsek was recorded before sunrise. The count starts from the following day, but a hefsek is usually done in the daytime close to sunset; check the time and clarify.", "Le hefsek a été enregistré avant le lever du soleil. Le décompte commence le lendemain, mais le hefsek se fait d'habitude de jour, près du coucher du soleil ; vérifiez l'heure et renseignez-vous.", "El hefsek se registró antes del amanecer. El conteo empieza al día siguiente, pero el hefsek suele hacerse de día, cerca de la puesta del sol; verifique la hora y consulte."],
    ["בדיקה שנרשמה מחוץ לשעות היום", "Bedikah recorded outside daytime hours", "Bedika enregistrée hors des heures de jour", "Bedika registrada fuera de las horas del día"],
    ["הבדיקה נרשמה בלילה או לפני עלות השחר, ולכן לא נספרה כבדיקה של יום מימי הספירה. יש לברר.", "The bedikah was recorded at night or before dawn, so it was not counted as a bedikah of one of the counted days. Please clarify.", "La bedika a été enregistrée la nuit ou avant l'aube ; elle n'a donc pas été comptée pour l'un des jours du décompte. À clarifier.", "La bedika se registró de noche o antes del alba, por lo que no se contó como bedika de uno de los días del conteo. Hay que consultar."],
    ["אין צאת כוכבים מחושב בליל הטבילה", "No calculated nightfall on the immersion night", "Pas de tombée de la nuit calculée pour la nuit de la tevila", "No hay salida de las estrellas calculada en la noche de la tevilá"],
    ["במיקום ובתאריך הזה השמש אינה יורדת {n}° מתחת לאופק, ולכן לא נקבעה שעת ליל הטבילה. נדרשת הוראה אישית.", "At this location and date the sun does not go {n}° below the horizon, so no immersion-night time was set. A personal ruling is needed.", "À cet endroit et à cette date, le soleil ne descend pas à {n}° sous l'horizon ; l'heure de la nuit de la tevila n'a donc pas été fixée. Une décision personnelle est nécessaire.", "En este lugar y fecha el sol no baja {n}° bajo el horizonte, por lo que no se fijó la hora de la noche de la tevilá. Se necesita una indicación personal."],
    ["אין שקיעה ביום ההפסק המוקדם", "No sunset on the earliest hefsek day", "Pas de coucher du soleil le jour du hefsek le plus tôt", "No hay puesta del sol el día del hefsek más temprano"],
    ["במיקום ובתאריך הזה אין שקיעה, ולכן לא נקבעה תזכורת להפסק. נדרשת הוראה אישית.", "There is no sunset at this location and date, so no hefsek reminder was set. A personal ruling is needed.", "Il n'y a pas de coucher du soleil à cet endroit et à cette date ; aucun rappel de hefsek n'a donc été fixé. Une décision personnelle est nécessaire.", "No hay puesta del sol en este lugar y fecha, por lo que no se fijó recordatorio del hefsek. Se necesita una indicación personal."],
    ["הפלגת חב״ד תחושב אחרי ההפסק", "The Chabad interval will be calculated after the hefsek", "L'intervalle Habad sera calculé après le hefsek", "El intervalo de Jabad se calculará después del hefsek"],
    ["בשיטה זו המועד נספר מההפסק שאחרי הראייה האחרונה. כשיירשם הפסק נקי יופיע המועד.", "In this method the date is counted from the hefsek after the last sighting. Once a clean hefsek is recorded, the date will appear.", "Dans cette méthode, la date est comptée à partir du hefsek qui suit le dernier saignement. Elle apparaîtra une fois un hefsek propre enregistré.", "En este método la fecha se cuenta desde el hefsek posterior al último sangrado. Aparecerá cuando se registre un hefsek limpio."],
    ["הטבילה נרשמה לפני ליל הטבילה המחושב", "Immersion recorded before the calculated immersion night", "Tevila enregistrée avant la nuit de tevila calculée", "Tevilá registrada antes de la noche de tevilá calculada"],
    ["לפי ההפסק שנרשם, ליל הטבילה הוא אחרי צאת הכוכבים של היום השביעי. ייתכן שהרישום שגוי או שהייתה הוראה מיוחדת; יש לברר.", "According to the recorded hefsek, the immersion night is after nightfall of the seventh day. The entry may be wrong or there may have been a special ruling; please clarify.", "D'après le hefsek enregistré, la nuit de la tevila est après la tombée de la nuit du septième jour. L'entrée est peut-être erronée ou il y a eu une décision particulière ; à clarifier.", "Según el hefsek registrado, la noche de la tevilá es después de la salida de las estrellas del séptimo día. Puede que el registro sea erróneo o que hubiera una indicación especial; hay que consultar."],

    ["ראייה סמוך לשקיעה או בין השמשות", "Sighting near sunset or during bein hashmashot", "Écoulement près du coucher du soleil ou pendant bein hachmachot", "Sangrado cerca de la puesta del sol o en bein hashmashot"],

    ["השעיית החישוב עד בירור", "Suspend the calculation until clarified", "Suspendre le calcul jusqu'à clarification", "Suspender el cálculo hasta aclararlo"],
    ["הפסק טהרה אחרי השקיעה", "Hefsek tahara after sunset", "Hefsek tahara après le coucher du soleil", "Hefsek tahará después de la puesta del sol"],
    ["רק הפסק לפני השקיעה", "Only a hefsek before sunset", "Seulement un hefsek avant le coucher du soleil", "Solo un hefsek antes de la puesta del sol"],
    ["בדיעבד עד 13.5 דקות זמניות — הרב עובדיה יוסף", "After the fact, up to 13.5 proportional minutes — Rav Ovadia Yosef", "A posteriori, jusqu'à 13,5 minutes proportionnelles — Rav Ovadia Yossef", "A posteriori, hasta 13,5 minutos proporcionales — Rav Ovadia Yosef"],
    ["לחומרא שתי העונות", "Stringently, both onot", "Par rigueur, les deux onot", "Por rigor, ambas onot"],
    ["השעיית החישוב ובירור", "Suspend the calculation and clarify", "Suspendre le calcul et clarifier", "Suspender el cálculo y aclarar"],
    ["רק לפני השקיעה", "Only before sunset", "Seulement avant le coucher du soleil", "Solo antes de la puesta del sol"],
    ["בדיעבד עד 13.5 דקות זמניות אחרי השקיעה (הרב עובדיה יוסף)", "After the fact, up to 13.5 proportional minutes after sunset (Rav Ovadia Yosef)", "A posteriori, jusqu'à 13,5 minutes proportionnelles après le coucher du soleil (Rav Ovadia Yossef)", "A posteriori, hasta 13,5 minutos proporcionales después de la puesta del sol (Rav Ovadia Yosef)"],
    ["לברר עם רב", "Ask a rabbi", "À vérifier avec un rav", "Consultar con un rabino"],
    ["לברר עם רב:", "Ask a rabbi:", "À vérifier avec un rav :", "Consultar con un rabino:"],
    ["בחירת שיטה מוכנה קובעת את כל ההגדרות שלמטה בבת אחת. אחר כך אפשר לשנות כל הגדרה.", "Choosing a preset method sets all the settings below at once. You can then change any setting.", "Choisir une méthode prédéfinie fixe tous les réglages ci-dessous d'un coup. Vous pouvez ensuite modifier chaque réglage.", "Elegir un método predefinido fija de una vez todos los ajustes de abajo. Después puede cambiar cualquier ajuste."],
    ["מה קובעת השיטה ומקורותיה", "What the method sets, and its sources", "Ce que fixe la méthode, et ses sources", "Qué fija el método y sus fuentes"],
    ["שונו מהשיטה: {n} הגדרות. בחירה מחדש של השיטה מחזירה אותן.", "Changed from the method: {n} settings. Choosing the method again restores them.", "Modifiés par rapport à la méthode : {n} réglages. Choisir à nouveau la méthode les rétablit.", "Cambiados respecto al método: {n} ajustes. Elegir de nuevo el método los restablece."],
    ["שיטה: {x} (עם שינויים)", "Method: {x} (with changes)", "Méthode : {x} (avec modifications)", "Método: {x} (con cambios)"],
    ["שיטה: {x}", "Method: {x}", "Méthode : {x}", "Método: {x}"],
    ["צאת הכוכבים: {x}", "Nightfall: {x}", "Tombée de la nuit : {x}", "Salida de las estrellas: {x}"],
    ["ראייה בין השמשות: {x}", "Sighting in bein hashmashot: {x}", "Écoulement pendant bein hachmachot : {x}", "Sangrado en bein hashmashot: {x}"],
    ["הפסק אחרי השקיעה: {x}", "Hefsek after sunset: {x}", "Hefsek après le coucher du soleil : {x}", "Hefsek después de la puesta del sol: {x}"],
    ["העונה הסמוכה", "adjacent onah", "onah voisine", "onah contigua"],
    ["עונת החודש · העונה הסמוכה", "Monthly onah · adjacent onah", "Onah du mois · onah voisine", "Onah del mes · onah contigua"],
    ["הראייה הייתה סמוך לגבול העונה או בין השמשות; לחומרא חוששים גם לעונה הסמוכה.", "The sighting was near the boundary of the onah or during bein hashmashot; stringently, the adjacent onah is observed too.", "L'écoulement était proche de la limite de l'onah ou pendant bein hachmachot ; par rigueur, on observe aussi l'onah voisine.", "El sangrado fue cerca del límite de la onah o en bein hashmashot; por rigor se observa también la onah contigua."],
    ["הראייה הייתה סמוך לשקיעה או לזריחה, או בין השקיעה לצאת הכוכבים. לחומרא חושבו מועדי הפרישה לשתי העונות, וההמתנה נספרת מהיום המאוחר. יש לברר.", "The sighting was near sunset or sunrise, or between sunset and nightfall. Stringently, separation dates were calculated for both onot, and the wait is counted from the later day. Please clarify.", "L'écoulement était proche du coucher ou du lever du soleil, ou entre le coucher du soleil et la tombée de la nuit. Par rigueur, les dates de séparation ont été calculées pour les deux onot, et l'attente est comptée à partir du jour le plus tardif. À clarifier.", "El sangrado fue cerca de la puesta o la salida del sol, o entre la puesta del sol y la salida de las estrellas. Por rigor se calcularon fechas de separación para ambas onot, y la espera se cuenta desde el día posterior. Hay que aclararlo."],
    ["הפסק סמוך לשקיעה או אחריה — תקף בדיעבד לפי השיטה שנבחרה", "Hefsek near or after sunset — valid after the fact under the chosen method", "Hefsek près du coucher du soleil ou après — valable a posteriori selon la méthode choisie", "Hefsek cerca de la puesta del sol o después — válido a posteriori según el método elegido"],
    ["לפי פסק הרב עובדיה יוסף הפסק שנעשה עד 13.5 דקות זמניות אחרי השקיעה תקף בדיעבד, ונספר ליום שהסתיים. לכתחילה עושים את ההפסק לפני השקיעה. יש לוודא עם רב, ובפרט לגבי המקום (יש שכתבו שבארץ ישראל השיעור קצר יותר).", "According to Rav Ovadia Yosef, a hefsek done up to 13.5 proportional minutes after sunset is valid after the fact and counts for the day that ended. Ideally the hefsek is done before sunset. Confirm with a rabbi, especially regarding the location (some write that in Israel the window is shorter).", "Selon le Rav Ovadia Yossef, un hefsek fait jusqu'à 13,5 minutes proportionnelles après le coucher du soleil est valable a posteriori et compte pour le jour écoulé. Idéalement, on fait le hefsek avant le coucher du soleil. À vérifier avec un rav, surtout selon le lieu (certains écrivent qu'en Israël la durée est plus courte).", "Según el Rav Ovadia Yosef, un hefsek hecho hasta 13,5 minutos proporcionales después de la puesta del sol es válido a posteriori y cuenta para el día que terminó. Lo ideal es hacer el hefsek antes de la puesta del sol. Hay que confirmarlo con un rabino, sobre todo según el lugar (algunos escriben que en Israel el margen es más corto)."],
    ["במיקום ובתאריך הזה אין שקיעה, ולכן לא נקבעה שעת ליל הטבילה. נדרשת הוראה אישית.", "There is no sunset at this location and date, so no immersion-night time was set. A personal ruling is needed.", "Il n'y a pas de coucher du soleil à ce lieu et à cette date, donc aucune heure de nuit de tevila n'a été fixée. Une décision personnelle est nécessaire.", "No hay puesta del sol en este lugar y fecha, por lo que no se fijó la hora de la noche de tevilá. Se necesita una instrucción personal."],
    ["זמני השמש מחושבים בגובה פני הים. צאת הכוכבים לפי ההגדרה שנבחרה: 8.5° או 7.083° מתחת לאופק, 13.5 דקות זמניות (הגאונים), או 18 או 20 דקות אחרי השקיעה.", "Sun times are calculated at sea level. Nightfall follows the chosen setting: 8.5° or 7.083° below the horizon, 13.5 proportional minutes (Geonim), or 18 or 20 minutes after sunset.", "Les heures solaires sont calculées au niveau de la mer. La tombée de la nuit suit le réglage choisi : 8,5° ou 7,083° sous l'horizon, 13,5 minutes proportionnelles (Guéonim), ou 18 ou 20 minutes après le coucher du soleil.", "Los horarios solares se calculan al nivel del mar. La salida de las estrellas sigue el ajuste elegido: 8,5° o 7,083° bajo el horizonte, 13,5 minutos proporcionales (Gueonim), o 18 o 20 minutos después de la puesta del sol."],
    ["רישום בטווח שלוש דקות מהזריחה או מהשקיעה, או בין השקיעה לצאת הכוכבים, מסומן לבירור. שלוש הדקות הן סף לסימון ולא הגדרה של בין השמשות.", "An entry within three minutes of sunrise or sunset, or between sunset and nightfall, is flagged for clarification. The three minutes are a flagging threshold, not a definition of bein hashmashot.", "Une entrée à moins de trois minutes du lever ou du coucher du soleil, ou entre le coucher du soleil et la tombée de la nuit, est signalée pour clarification. Les trois minutes sont un seuil de signalement, pas une définition de bein hachmachot.", "Una entrada a menos de tres minutos de la salida o la puesta del sol, o entre la puesta del sol y la salida de las estrellas, se marca para aclarar. Los tres minutos son un umbral de aviso, no una definición de bein hashmashot."],
    ["ארבעה ימים מתחילת הנידה (הרב עובדיה יוסף, ספרדי): יום הראייה הוא יום 1 וההפסק ביום הרביעי. ראתה בליל שני — ההפסק ביום חמישי.", "Four days from the onset of niddah (Rav Ovadia Yosef, Sephardi practice): the day of the sighting is day 1 and the hefsek is on the fourth day. Saw on Sunday night (Monday's night) — hefsek on Thursday.", "Quatre jours depuis le début de la nidda (Rav Ovadia Yossef, usage séfarade) : le jour de l'écoulement est le jour 1 et le hefsek est le quatrième jour. Écoulement le dimanche soir (nuit de lundi) — hefsek le jeudi.", "Cuatro días desde el inicio de la nidá (Rav Ovadia Yosef, costumbre sefardí): el día del sangrado es el día 1 y el hefsek es el cuarto día. Sangrado el domingo por la noche (noche del lunes) — hefsek el jueves."],
    ["ארבעה ימים ממועד היחסים: נספרים ממועד היחסים שנרשם כבסיס, ולא מהראייה. בלי בסיס רשום אין חישוב, ומופיעה נקודה לבירור.", "Four days from relations: counted from the recorded relations, not from the sighting. Without a recorded base there is no calculation, and a point for clarification appears.", "Quatre jours depuis les relations : comptés à partir des relations enregistrées, pas de l'écoulement. Sans base enregistrée, pas de calcul, et un point à clarifier apparaît.", "Cuatro días desde las relaciones: se cuentan desde las relaciones registradas, no desde el sangrado. Sin base registrada no hay cálculo y aparece un punto para aclarar."],
    ["ראייה סמוך לשקיעה או בין השמשות: ההמתנה נספרת מהיום העברי המאוחר, לחומרא.", "Sighting near sunset or during bein hashmashot: the wait is counted from the later Hebrew day, stringently.", "Écoulement près du coucher du soleil ou pendant bein hachmachot : l'attente est comptée à partir du jour hébraïque le plus tardif, par rigueur.", "Sangrado cerca de la puesta del sol o en bein hashmashot: la espera se cuenta desde el día hebreo posterior, por rigor."],
    ["ראייה בין השמשות", "Sighting during bein hashmashot", "Écoulement pendant bein hachmachot", "Sangrado en bein hashmashot"],
    ["ראייה בין השקיעה לצאת הכוכבים, או בשלוש הדקות שסביב השקיעה והזריחה: לפי ברירת המחדל חוששים לשתי העונות — העונה שהסתיימה והעונה שהתחילה — בעונה הבינונית, בעונת החודש ובהפלגה (ש״ך יו״ד קפד, ס״ק יג–יד, בשם הב״ח; כך נוהגים למעשה). הרישום מסומן גם לבירור.", "A sighting between sunset and nightfall, or within three minutes of sunset or sunrise: by default both onot are observed — the onah that ended and the one that began — for the onah beinonit, the monthly onah and the haflagah (Shach YD 184:13–14, citing the Bach; this is the common practice). The entry is also flagged for clarification.", "Un écoulement entre le coucher du soleil et la tombée de la nuit, ou à moins de trois minutes du coucher ou du lever : par défaut on observe les deux onot — celle qui s'achève et celle qui commence — pour l'onah beinonit, l'onah du mois et la haflaga (Shach YD 184:13–14, au nom du Bach ; c'est l'usage). L'entrée est aussi signalée pour clarification.", "Un sangrado entre la puesta del sol y la salida de las estrellas, o a menos de tres minutos de la puesta o la salida del sol: por defecto se observan ambas onot — la que terminó y la que empezó — para la onah beinonit, la onah del mes y la haflagá (Shach YD 184:13–14, en nombre del Bach; así se acostumbra). La entrada también se marca para aclarar."],
    ["אפשר לבחור בהגדרות להשעות את החישוב עד בירור, כמו בגרסאות קודמות.", "In the settings you can choose to suspend the calculation until clarified, as in earlier versions.", "Dans les réglages, on peut choisir de suspendre le calcul jusqu'à clarification, comme dans les versions précédentes.", "En los ajustes se puede elegir suspender el cálculo hasta aclararlo, como en versiones anteriores."],
    ["סוף בין השמשות נקבע לפי הגדרת צאת הכוכבים. לפי 13.5 דקות זמניות (הגאונים, הרב עובדיה יוסף) ראייה מאוחרת יותר היא לילה ודאי.", "The end of bein hashmashot follows the nightfall setting. With 13.5 proportional minutes (Geonim, Rav Ovadia Yosef), a later sighting is certainly night.", "La fin de bein hachmachot suit le réglage de la tombée de la nuit. Avec 13,5 minutes proportionnelles (Guéonim, Rav Ovadia Yossef), un écoulement plus tardif est certainement la nuit.", "El fin de bein hashmashot sigue el ajuste de salida de las estrellas. Con 13,5 minutos proporcionales (Gueonim, Rav Ovadia Yosef), un sangrado posterior es noche con certeza."],
    ["שיטות מוכנות", "Preset methods", "Méthodes prédéfinies", "Métodos predefinidos"],
    ["שיטה מוכנה (מנהג אשכנז הרווח, שיטת הרב עובדיה יוסף (ספרדי), מנהג חב״ד) קובעת את כל הגדרות החישוב בבת אחת, ואפשר לשנות כל הגדרה אחר כך.", "A preset method (common Ashkenazi practice, Rav Ovadia Yosef / Sephardi practice, Chabad practice) sets all calculation settings at once, and any setting can be changed afterwards.", "Une méthode prédéfinie (usage ashkénaze courant, Rav Ovadia Yossef / usage séfarade, usage Habad) fixe tous les réglages de calcul d'un coup, et chaque réglage peut être modifié ensuite.", "Un método predefinido (costumbre asquenazí habitual, Rav Ovadia Yosef / costumbre sefardí, costumbre de Jabad) fija todos los ajustes de cálculo de una vez, y cualquier ajuste se puede cambiar después."],
    ["לכל ערך בשיטה מופיע מקור בהגדרות. ערכים שהמקורות חלוקים בהם מסומנים ״לברר עם רב״. השיטות אינן תחליף להוראת רב.", "Each value in a method shows its source in the settings. Values on which sources disagree are marked “ask a rabbi”. The methods are not a substitute for a rabbi's ruling.", "Chaque valeur d'une méthode indique sa source dans les réglages. Les valeurs sur lesquelles les sources divergent sont marquées « à vérifier avec un rav ». Les méthodes ne remplacent pas la décision d'un rav.", "Cada valor de un método muestra su fuente en los ajustes. Los valores en que las fuentes discrepan se marcan «consultar con un rabino». Los métodos no sustituyen la instrucción de un rabino."],
    ["בבחירת שיטת הרב עובדיה יוסף: הפסק עד 13.5 דקות זמניות אחרי השקיעה מתקבל בדיעבד ונספר ליום שהסתיים, ומסומן לבירור. לכתחילה עושים הפסק לפני השקיעה.", "With the Rav Ovadia Yosef method: a hefsek up to 13.5 proportional minutes after sunset is accepted after the fact, counted for the day that ended, and flagged for clarification. Ideally the hefsek is done before sunset.", "Avec la méthode du Rav Ovadia Yossef : un hefsek jusqu'à 13,5 minutes proportionnelles après le coucher du soleil est accepté a posteriori, compté pour le jour écoulé et signalé pour clarification. Idéalement, le hefsek se fait avant le coucher du soleil.", "Con el método del Rav Ovadia Yosef: un hefsek hasta 13,5 minutos proporcionales después de la puesta del sol se acepta a posteriori, cuenta para el día que terminó y se marca para aclarar. Lo ideal es hacer el hefsek antes de la puesta del sol."],
    ["שתי העונות, יום 31 ואור זרוע הם שלוש הגדרות נפרדות. השיטות המוכנות קובעות אותן לפי המנהג, ואפשר לשנות.", "Both onot, day 31 and Or Zarua are three separate settings. The preset methods set them according to the custom, and they can be changed.", "Les deux onot, le jour 31 et Or Zaroua sont trois réglages distincts. Les méthodes prédéfinies les fixent selon l'usage, et on peut les modifier.", "Ambas onot, el día 31 y Or Zarúa son tres ajustes separados. Los métodos predefinidos los fijan según la costumbre, y se pueden cambiar."],
    ["מי ששומרת ימים 30 ו-31 שומרת את עונת אור זרוע ליום 30 בלבד. מקור ראשוני לכך לא אותר.", "Those who keep days 30 and 31 keep the Or Zarua onah for day 30 only. No primary source for this was found.", "Celles qui gardent les jours 30 et 31 gardent l'onah d'Or Zaroua pour le jour 30 seulement. Aucune source primaire n'a été trouvée pour cela.", "Quien guarda los días 30 y 31 guarda la onah de Or Zarúa solo para el día 30. No se encontró una fuente primaria para ello."],
    ["חמישה ימים מתחילת הווסת: יום הראייה הוא יום 1, וההפסק ביום החמישי לפני השקיעה (רמ״א יו״ד קצו, יא; כך נוהגים כל קהילות אשכנז).", "Five days from the onset: the day of the sighting is day 1, and the hefsek is on the fifth day before sunset (Rema YD 196:11; the practice of all Ashkenazi communities).", "Cinq jours depuis le début : le jour de l'écoulement est le jour 1, et le hefsek a lieu le cinquième jour avant le coucher du soleil (Rema YD 196:11 ; usage de toutes les communautés ashkénazes).", "Cinco días desde el inicio: el día del sangrado es el día 1, y el hefsek es el quinto día antes de la puesta del sol (Remá YD 196:11; costumbre de todas las comunidades asquenazíes)."],
    ["עונה בינונית ביום 30, בעונה שבה התחילה הראייה (שו״ע יו״ד קפט, א). יש שנוהגים לפרוש את כל היממה (כרתי ופלתי) — זו הגדרה נפרדת.", "Onah beinonit on day 30, in the onah in which the sighting began (SA YD 189:1). Some keep the whole 24 hours (Kreti uPleti) — that is a separate setting.", "Onah beinonit le jour 30, dans l'onah où l'écoulement a commencé (Choul'han Aroukh YD 189:1). Certains gardent les 24 heures (Kreti ouPleti) — c'est un réglage distinct.", "Onah beinonit el día 30, en la onah en que empezó el sangrado (SA YD 189:1). Algunos guardan las 24 horas (Kreti uPleti); es un ajuste aparte."],
    ["רבים מהאשכנזים נוהגים להחמיר גם ביום 31 (חוות דעת). אינו חובה מן הדין.", "Many Ashkenazim are also stringent on day 31 (Chavot Da'at). It is not required by the letter of the law.", "Beaucoup d'Ashkénazes sont aussi rigoureux le jour 31 (Havot Daat). Ce n'est pas obligatoire selon la stricte loi.", "Muchos asquenazíes son estrictos también el día 31 (Javot Daat). No es obligatorio por ley estricta."],
    ["עונת אור זרוע — העונה שלפני כל וסת. נתקבלה ברוב קהילות אשכנז; מי ששומרת ימים 30 ו-31 שומרת אותה ליום 30 בלבד.", "Or Zarua onah — the onah before each veset. Accepted in most Ashkenazi communities; those who keep days 30 and 31 keep it for day 30 only.", "Onah d'Or Zaroua — l'onah qui précède chaque vesset. Acceptée dans la plupart des communautés ashkénazes ; celles qui gardent les jours 30 et 31 la gardent pour le jour 30 seulement.", "Onah de Or Zarúa: la onah anterior a cada vést. Aceptada en la mayoría de las comunidades asquenazíes; quien guarda los días 30 y 31 la guarda solo para el día 30."],
    ["הפלגה בימים מתחילת וסת לתחילת וסת, בספירה כוללנית. הפלגה ארוכה שלא נעקרה (כי הראייה הבאה באה לפניה) נשמרת.", "Haflagah in days from the start of one period to the start of the next, counted inclusively. A longer haflagah that was not uprooted (because the next sighting came before it) is kept.", "Haflaga en jours du début d'une période au début de la suivante, comptage inclusif. Une haflaga plus longue non déracinée (car l'écoulement suivant est venu avant) est conservée.", "Haflagá en días desde el inicio de un período hasta el inicio del siguiente, contando de forma inclusiva. Una haflagá más larga que no fue anulada (porque el sangrado siguiente llegó antes) se mantiene."],
    ["ל׳ בחודש כשבחודש הבא אין ל׳: א׳ בחודש שאחריו, לחומרא (העונה הבינונית חלה ממילא בכ״ט).", "The 30th when the next month has no 30th: the 1st of the following month, as a stringency (the onah beinonit falls on the 29th anyway).", "Le 30 quand le mois suivant n'a pas de 30 : le 1er du mois d'après, par rigueur (l'onah beinonit tombe de toute façon le 29).", "El día 30 cuando el mes siguiente no tiene 30: el día 1 del mes posterior, por rigor (la onah beinonit cae de todos modos el 29)."],
    ["בדיקה בבוקר ולפני השקיעה בכל אחד משבעת הימים לכתחילה (שו״ע יו״ד קצו, ד).", "A bedikah in the morning and before sunset on each of the seven days, ideally (SA YD 196:4).", "Une bedika le matin et avant le coucher du soleil chacun des sept jours, idéalement (Choul'han Aroukh YD 196:4).", "Una bedicá por la mañana y antes de la puesta del sol en cada uno de los siete días, idealmente (SA YD 196:4)."],
    ["צאת הכוכבים 8.5° מתחת לאופק, לחומרא, לליל הטבילה ולסוף בין השמשות. יש שנוהגים בשיעור אחר.", "Nightfall at 8.5° below the horizon, stringently, for the immersion night and the end of bein hashmashot. Some follow a different measure.", "Tombée de la nuit à 8,5° sous l'horizon, par rigueur, pour la nuit de tevila et la fin de bein hachmachot. Certains suivent une autre mesure.", "Salida de las estrellas a 8,5° bajo el horizonte, por rigor, para la noche de tevilá y el fin de bein hashmashot. Algunos siguen otra medida."],
    ["ראייה בין השקיעה לצאת הכוכבים: מעיקר הדין כלילה, ונוהגים להחמיר ולחשוש לשתי העונות (ש״ך יו״ד קפד, ס״ק יג–יד, בשם הב״ח).", "A sighting between sunset and nightfall: by strict law it is night, and the practice is to be stringent and observe both onot (Shach YD 184:13–14, citing the Bach).", "Écoulement entre le coucher du soleil et la tombée de la nuit : selon la stricte loi c'est la nuit, et l'usage est d'être rigoureux et d'observer les deux onot (Shach YD 184:13–14, au nom du Bach).", "Sangrado entre la puesta del sol y la salida de las estrellas: por ley estricta es noche, y se acostumbra ser estricto y observar ambas onot (Shach YD 184:13–14, en nombre del Bach)."],
    ["הפסק טהרה רק לפני השקיעה. לרוב פוסקי אשכנז הפסק אחרי השקיעה אינו תקף אף בדיעבד.", "Hefsek tahara only before sunset. For most Ashkenazi poskim a hefsek after sunset is not valid even after the fact.", "Hefsek tahara seulement avant le coucher du soleil. Pour la plupart des décisionnaires ashkénazes, un hefsek après le coucher du soleil n'est pas valable même a posteriori.", "Hefsek tahará solo antes de la puesta del sol. Para la mayoría de los poskim asquenazíes, un hefsek después de la puesta del sol no es válido ni a posteriori."],
    ["ארבעה ימים: יום הראייה הוא יום 1 וההפסק ביום הרביעי (ראתה בליל שני — הפסק ביום חמישי). לפי הרב עובדיה יסוד הדין הוא 72 שעות מהתשמיש; אם לא היו יחסים בארבעת הימים שלפני הראייה, יש שמתירים הפסק מיד כשפסק הדם. רבים מהפוסקים הספרדים ממתינים חמישה ימים.", "Four days: the day of the sighting is day 1 and the hefsek is on the fourth day (saw on Monday's night — hefsek on Thursday). According to Rav Ovadia the basis is 72 hours from relations; if there were no relations in the four days before the sighting, some permit a hefsek as soon as the bleeding stops. Many Sephardi poskim wait five days.", "Quatre jours : le jour de l'écoulement est le jour 1 et le hefsek est le quatrième jour (écoulement la nuit de lundi — hefsek le jeudi). Selon le Rav Ovadia, la base est de 72 heures depuis les relations ; s'il n'y a pas eu de relations dans les quatre jours précédant l'écoulement, certains permettent un hefsek dès l'arrêt du saignement. Beaucoup de décisionnaires séfarades attendent cinq jours.", "Cuatro días: el día del sangrado es el día 1 y el hefsek es el cuarto día (sangrado la noche del lunes — hefsek el jueves). Según el Rav Ovadia, la base son 72 horas desde las relaciones; si no hubo relaciones en los cuatro días anteriores al sangrado, algunos permiten el hefsek en cuanto cesa el sangrado. Muchos poskim sefardíes esperan cinco días."],
    ["עונה בינונית ביום 30 בלבד, בעונת הראייה (שו״ע יו״ד קפט, א).", "Onah beinonit on day 30 only, in the onah of the sighting (SA YD 189:1).", "Onah beinonit le jour 30 seulement, dans l'onah de l'écoulement (Choul'han Aroukh YD 189:1).", "Onah beinonit solo el día 30, en la onah del sangrado (SA YD 189:1)."],
    ["יום 31 אינו נדרש לפי השו״ע. יש מספרדים שמחמירים.", "Day 31 is not required by the Shulchan Aruch. Some Sephardim are stringent.", "Le jour 31 n'est pas requis selon le Choul'han Aroukh. Certains Séfarades sont rigoureux.", "El día 31 no es obligatorio según el Shulján Aruj. Algunos sefardíes son estrictos."],
    ["לפי טהרת הבית ספרדים אינם חוששים לעונת אור זרוע. הבן איש חי חשש לה.", "According to Taharat HaBayit, Sephardim do not observe the Or Zarua onah. The Ben Ish Chai was concerned for it.", "Selon Taharat HaBayit, les Séfarades n'observent pas l'onah d'Or Zaroua. Le Ben Ich 'Haï en tenait compte.", "Según Taharat HaBayit, los sefardíes no observan la onah de Or Zarúa. El Ben Ish Jai sí la tenía en cuenta."],
    ["הפלגה בימים מתחילת וסת לתחילת וסת. שימור הפלגה ארוכה הופעל לחומרא — לברר.", "Haflagah in days from the start of one period to the start of the next. Keeping a longer haflagah is on, stringently — ask.", "Haflaga en jours du début d'une période au début de la suivante. La conservation d'une haflaga plus longue est activée par rigueur — à vérifier.", "Haflagá en días desde el inicio de un período al inicio del siguiente. Mantener una haflagá más larga está activado por rigor; hay que consultarlo."],
    ["ל׳ בחודש כשבחודש הבא אין ל׳: א׳ בחודש שאחריו (לחומרא).", "The 30th when the next month has no 30th: the 1st of the following month (stringently).", "Le 30 quand le mois suivant n'a pas de 30 : le 1er du mois d'après (par rigueur).", "El día 30 cuando el mes siguiente no tiene 30: el día 1 del mes posterior (por rigor)."],
    ["ליל הטבילה: 20 דקות אחרי השקיעה, לחומרא. לשיטת הגאונים שהרב עובדיה נוקט צאת הכוכבים כ-13.5 דקות זמניות; לברר עם רב מתי לטבול.", "Immersion night: 20 minutes after sunset, stringently. Under the Geonim, whom Rav Ovadia follows, nightfall is about 13.5 proportional minutes; ask a rabbi when to immerse.", "Nuit de tevila : 20 minutes après le coucher du soleil, par rigueur. Selon les Guéonim, que suit le Rav Ovadia, la tombée de la nuit est d'environ 13,5 minutes proportionnelles ; demander à un rav quand s'immerger.", "Noche de tevilá: 20 minutos después de la puesta del sol, por rigor. Según los Gueonim, que sigue el Rav Ovadia, la salida de las estrellas es a unos 13,5 minutos proporcionales; consultar a un rabino cuándo sumergirse."],
    ["ראייה סמוך לשקיעה או בין השמשות: חוששים לשתי העונות. אחרי 13.5 דקות זמניות הזמן נחשב לילה ודאי.", "A sighting near sunset or during bein hashmashot: both onot are observed. After 13.5 proportional minutes it is certainly night.", "Écoulement près du coucher du soleil ou pendant bein hachmachot : on observe les deux onot. Après 13,5 minutes proportionnelles, c'est certainement la nuit.", "Sangrado cerca de la puesta del sol o en bein hashmashot: se observan ambas onot. Después de 13,5 minutos proporcionales es noche con certeza."],
    ["הפסק לכתחילה לפני השקיעה. בדיעבד, לפי טהרת הבית, הפסק עד 13.5 דקות זמניות אחרי השקיעה תקף ונספר ליום שהסתיים (יש שכתבו שבארץ ישראל השיעור קצר יותר).", "Ideally the hefsek is before sunset. After the fact, according to Taharat HaBayit, a hefsek up to 13.5 proportional minutes after sunset is valid and counts for the day that ended (some write that in Israel the window is shorter).", "Idéalement, le hefsek a lieu avant le coucher du soleil. A posteriori, selon Taharat HaBayit, un hefsek jusqu'à 13,5 minutes proportionnelles après le coucher du soleil est valable et compte pour le jour écoulé (certains écrivent qu'en Israël la durée est plus courte).", "Lo ideal es hacer el hefsek antes de la puesta del sol. A posteriori, según Taharat HaBayit, un hefsek hasta 13,5 minutos proporcionales después de la puesta del sol es válido y cuenta para el día que terminó (algunos escriben que en Israel el margen es más corto)."],
    ["חמישה ימים מתחילת הווסת, ההפסק ביום החמישי.", "Five days from the onset; the hefsek is on the fifth day.", "Cinq jours depuis le début ; le hefsek a lieu le cinquième jour.", "Cinco días desde el inicio; el hefsek es el quinto día."],
    ["הפלגה בעונות: מספר העונות מההפסק ועד הראייה הבאה, ומועד חדש נספר מההפסק הנוכחי; הפלגה ארוכה נשמרת.", "Haflagah in onot: the number of onot from the hefsek to the next sighting, and a new date is counted from the current hefsek; a longer haflagah is kept.", "Haflaga en onot : le nombre d'onot du hefsek à l'écoulement suivant, et une nouvelle date est comptée à partir du hefsek actuel ; une haflaga plus longue est conservée.", "Haflagá en onot: el número de onot desde el hefsek hasta el sangrado siguiente, y una nueva fecha se cuenta desde el hefsek actual; una haflagá más larga se mantiene."],
    ["עונה בינונית ביום 30 — כל המעת לעת, מהשקיעה ועד השקיעה (שו״ע הרב).", "Onah beinonit on day 30 — the full 24 hours, from sunset to sunset (Shulchan Aruch HaRav).", "Onah beinonit le jour 30 — les 24 heures, d'un coucher du soleil à l'autre (Choul'han Aroukh HaRav).", "Onah beinonit el día 30: las 24 horas completas, de puesta a puesta del sol (Shulján Aruj HaRav)."],
    ["יום 31 אינו מופעל בשיטה זו. שולחן ערוך הרב מביא אותו בשם ״יש אומרים״. לברר.", "Day 31 is not applied in this method. The Shulchan Aruch HaRav brings it as \"some say\". Ask.", "Le jour 31 n'est pas appliqué dans cette méthode. Le Shulchan Aruch HaRav le cite comme « certains disent ». À vérifier.", "El día 31 no se aplica en este método. El Shulchan Aruch HaRav lo trae como «algunos dicen». Hay que consultarlo."],
    ["אור זרוע אינו מופעל כאן. לברר עם רב חב״די.", "Or Zarua is not turned on here. Ask a Chabad rabbi.", "Or Zaroua n'est pas activé ici. À vérifier avec un rav Habad.", "Or Zarúa no está activado aquí. Consultar con un rabino de Jabad."],
    ["ל׳ בחודש כשבחודש הבא אין ל׳: א׳ בחודש שאחריו.", "The 30th when the next month has no 30th: the 1st of the following month.", "Le 30 quand le mois suivant n'a pas de 30 : le 1er du mois d'après.", "El día 30 cuando el mes siguiente no tiene 30: el día 1 del mes posterior."],
    ["בדיקה בבוקר ולפני השקיעה בכל אחד משבעת הימים.", "A bedikah in the morning and before sunset on each of the seven days.", "Une bedika le matin et avant le coucher du soleil chacun des sept jours.", "Una bedicá por la mañana y antes de la puesta del sol en cada uno de los siete días."],
    ["צאת הכוכבים 8.5°, לחומרא. לברר את מנהג המקום.", "Nightfall at 8.5°, stringently. Ask about the local custom.", "Tombée de la nuit à 8,5°, par rigueur. Se renseigner sur l'usage local.", "Salida de las estrellas a 8,5°, por rigor. Consultar la costumbre local."],
    ["ראתה בין השמשות: מעיקר הדין חוששת לעונת הלילה בלבד, ויש להחמיר ולחשוש גם לעונת היום.", "Saw during bein hashmashot: by strict law she observes the night onah only, and one should be stringent and observe the day onah as well.", "Écoulement pendant bein hachmachot : selon la stricte loi, elle observe seulement l'onah de nuit, et il faut être rigoureux et observer aussi l'onah de jour.", "Sangrado en bein hashmashot: por ley estricta observa solo la onah de noche, y hay que ser estricto y observar también la onah de día."],
    ["הפסק טהרה רק לפני השקיעה.", "Hefsek tahara only before sunset.", "Hefsek tahara seulement avant le coucher du soleil.", "Hefsek tahará solo antes de la puesta del sol."],

    ["מלא: שם המועד והשעה", "Full: name of the date and time", "Complet : nom de l'échéance et heure", "Completo: nombre de la fecha y hora"],
    ["כשנעילת האפליקציה פעילה, הווידג׳ט תמיד דיסקרטי. לחיצה על הווידג׳ט פותחת את היומן.", "When the app lock is on, the widget is always discreet. Tapping the widget opens the diary.", "Quand le verrouillage de l'application est activé, le widget reste toujours discret. Toucher le widget ouvre le journal.", "Cuando el bloqueo de la aplicación está activado, el widget siempre es discreto. Al tocar el widget se abre el diario."],

    ["אם לא מצליח, נפתח עם הקוד", "If it fails, the code opens it", "En cas d'échec, le code permet d'ouvrir", "Si falla, se abre con el código"],

    ["הסתרה במסך האפליקציות האחרונות", "Hide in the recent apps screen", "Masquer dans l'écran des applications récentes", "Ocultar en la pantalla de aplicaciones recientes"],
    ["התוכן לא מוצג במעבר בין אפליקציות, וצילומי מסך נחסמים", "The content is not shown when switching apps, and screenshots are blocked", "Le contenu n'est pas affiché lors du changement d'application, et les captures d'écran sont bloquées", "El contenido no se muestra al cambiar de aplicación y las capturas de pantalla se bloquean"],

    ["נעילת היומן", "Lock the diary", "Verrouiller le journal", "Bloquear el diario"],
    ["בחרי קוד של 4 עד 6 ספרות. הקוד יידרש בכל פתיחה של האפליקציה. הקוד עצמו לא נשמר, רק גיבוב מוצפן שלו.", "Choose a code of 4 to 6 digits. It will be required every time the app opens. The code itself is not stored, only a cryptographic hash of it.", "Choisissez un code de 4 à 6 chiffres. Il sera demandé à chaque ouverture de l'application. Le code lui-même n'est pas enregistré, seulement une empreinte chiffrée.", "Elija un código de 4 a 6 dígitos. Se pedirá cada vez que se abra la aplicación. El código no se guarda, solo un hash cifrado."],
    ["הקוד הנוכחי", "Current code", "Code actuel", "Código actual"],
    ["קוד חדש", "New code", "Nouveau code", "Código nuevo"],
    ["שוב, לאימות", "Again, to confirm", "Encore, pour confirmer", "Otra vez, para confirmar"],
    ["חשוב לדעת:", "Important:", "Important :", "Importante:"],
    ["אם תשכחי את הקוד, אין דרך לשחזר אותו. האפשרות היחידה תהיה למחוק את כל הנתונים מהמכשיר. גיבוי מוצפן מאפשר לשחזר את היומן גם אחרי מחיקה, ולכן כדאי לשמור אחד.", "If you forget the code, there is no way to recover it. The only option will be to delete all data from the device. An encrypted backup lets you restore the diary even after deletion, so it is worth saving one.", "Si vous oubliez le code, il est impossible de le récupérer. La seule option sera de supprimer toutes les données de l'appareil. Une sauvegarde chiffrée permet de restaurer le journal même après la suppression : mieux vaut en garder une.", "Si olvida el código, no hay forma de recuperarlo. La única opción será eliminar todos los datos del dispositivo. Una copia cifrada permite restaurar el diario incluso después de eliminarlo, por eso conviene guardar una."],

  function viewCalendar(st, r, ctx) {

  const TERMS = [

  const S = M.SOURCES;
  const RULES = [
    { t: "היום העברי והעונה", p: ["כל רישום נשמר עם התאריך האזרחי, השעה המקומית והעיר. היום העברי מתחיל בשקיעה, ועונת היום נמשכת מהזריחה עד השקיעה.", "זמני השמש מחושבים בגובה פני הים. צאת הכוכבים לפי ההגדרה שנבחרה: 8.5° או 7.083° מתחת לאופק, 13.5 דקות זמניות (הגאונים), או 18 או 20 דקות אחרי השקיעה.", "השקיעה מעוגלת לדקה כלפי מטה, והזריחה וצאת הכוכבים כלפי מעלה, לחומרא. החישוב נבדק מול ״שקיעה במישור״ בלוח עיתים לבינה ונמצא תואם בטווח של שניות. שקיעה נראית, שמושפעת מהרים ומבניינים בסביבה, אינה מחושבת.", "רישום בטווח שלוש דקות מהזריחה או מהשקיעה, או בין השקיעה לצאת הכוכבים, מסומן לבירור. שלוש הדקות הן סף לסימון ולא הגדרה של בין השמשות.", "שעה כפולה או חסרה במעבר שעון, ומקום בלי זריחה או שקיעה (קוטב), אינם מסווגים אוטומטית."], src: S.calendar },
    { t: "המתנה לפני ההפסק", p: ["חמישה ימים: יום הראייה נספר כיום הראשון, וההפסק המוקדם ביום החמישי.", "ארבעה ימים מתחילת הנידה (הרב עובדיה יוסף, ספרדי): יום הראייה הוא יום 1 וההפסק ביום הרביעי. ראתה בליל שני — ההפסק ביום חמישי.",

    { t: "ראייה בין השמשות", p: ["ראייה בין השקיעה לצאת הכוכבים, או בשלוש הדקות שסביב השקיעה והזריחה: לפי ברירת המחדל חוששים לשתי העונות — העונה שהסתיימה והעונה שהתחילה — בעונה הבינונית, בעונת החודש ובהפלגה (ש״ך יו״ד קפד, ס״ק יג–יד, בשם הב״ח; כך נוהגים למעשה). הרישום מסומן גם לבירור.", "אפשר לבחור בהגדרות להשעות את החישוב עד בירור, כמו בגרסאות קודמות.", "סוף בין השמשות נקבע לפי הגדרת צאת הכוכבים. לפי 13.5 דקות זמניות (הגאונים, הרב עובדיה יוסף) ראייה מאוחרת יותר היא לילה ודאי."], src: S.bhs },
    { t: "שיטות מוכנות", p: ["שיטה מוכנה (מנהג אשכנז הרווח, שיטת הרב עובדיה יוסף (ספרדי), מנהג חב״ד) קובעת את כל הגדרות החישוב בבת אחת, ואפשר לשנות כל הגדרה אחר כך.", "לכל ערך בשיטה מופיע מקור בהגדרות. ערכים שהמקורות חלוקים בהם מסומנים ״לברר עם רב״. השיטות אינן תחליף להוראת רב."], src: [] },
    { t: "הפסק טהרה ושבעה נקיים", p: ["הספירה מתחילה רק מהפסק שנרשם כנקי, לפני השקיעה ולא בזמן מסופק, ולא לפני סוף ההמתנה. הפסק מוקדם מתקבל רק עם הוראה אישית מתועדת.", "בבחירת שיטת הרב עובדיה יוסף: הפסק עד 13.5 דקות זמניות אחרי השקיעה מתקבל בדיעבד ונספר ליום שהסתיים, ומסומן לבירור. לכתחילה עושים הפסק לפני השקיעה.", "יום א׳ הוא היום העברי שאחרי ההפסק. ליל הטבילה המתוכנן הוא במוצאי היום השביעי, וזה נשאר תכנון בלבד.", "חוסר רישום בדיקה באחד מימי הספירה (לפי הגדרת הבדיקות) מסומן לבירור כשהיום מסתיים בשקיעה, ואינו פוסל או מאשר. בוקר וערב נקבעים לפי חצות היום. בדיקה שנרשמה כלא נקייה אינה מאפסת אוטומטית."], src: [...S.hefsek, ...S.clean, "thbHefsek", ...S.mikvah] },
    { t: "עונת החודש", p: ["אותו יום בחודש העברי הבא, באותה עונה.", "ראייה בל׳ כשבחודש הבא אין ל׳: ברירת המחדל היא א׳ בחודש שאחרי החודש החסר, לחומרא. מקור ראשוני לדין זה לא אותר. אפשר לבחור דילוג.", "ראתה פעמיים באותו חודש: כל החישובים נעשים מהראייה האחרונה, ובנוסף נשמרת עונת החודש של הראייה הקודמת אם עוד לא הגיעה (רמ״א יו״ד קפט, יג; שו״ע הרב שם, ס״ק מד).", "בשנה מעוברת אדר א׳ עובר לאדר ב׳.", "שימור עונת חודש שחלה בזמן דימום הוא אפשרות נפרדת שדורשת תיעוד מלא."], src: [...S.monthly, "missing30"] },
    { t: "עונה בינונית", p: ["יום 30 בספירה כוללנית: יום הראייה הוא יום 1, כלומר 29 ימים אחריו, באותה עונה.", "שתי העונות, יום 31 ואור זרוע הם שלוש הגדרות נפרדות. השיטות המוכנות קובעות אותן לפי המנהג, ואפשר לשנות.", "מי ששומרת ימים 30 ו-31 שומרת את עונת אור זרוע ליום 30 בלבד. מקור ראשוני לכך לא אותר."], src: [...S.average, "orZarua31"] },
    { t: "הפלגה", p: ["בשיטת הימים: ההפרש בין התאריכים העבריים של שתי הראיות ועוד 1. אותו מרווח נספר מהראייה האחרונה, באותה עונה.", "בשיטת חב״ד: מספר העונות מההפסק הקודם ועד הראייה הבאה. המועד החדש נספר מההפסק הנוכחי. מספר זוגי נופל ביום ואי-זוגי בלילה. הפלגה ארוכה נשמרת כשמגיעה קצרה ממנה.", "ראייה מסופקת באמצע אינה נמחקת כדי לייצר מרווח ארוך."], src: [...S.interval, ...S.chabad] },

          <footer class="foot"><p class="disclaimer">${I("info", 16)}<span>גרסת בדיקה: החישובים טרם קיבלו אישור הלכתי, ואין לראות בהם פסק. בכל ספק פונים למורה הוראה.</span></p>

    const d = L.dir();
    document.documentElement.lang = L.lang; document.documentElement.dir = d;
    for (const id of ["app", "modal", "toast"]) { const el = document.getElementById(id); el.dir = d; el.lang = L.lang; }
    document.title = L.lang === "he" ? "מעיין" : "Maayan";
    if (save) storage.set(LANG_KEY, L.lang);
  }

  function render() {
    // נעול (או מכוסה ברקע): מציגים רק את מסך הנעילה. שום נתון מהיומן לא נבנה לתוך הדף.
    $("#app").classList.toggle("is-locked", !!(app.locked || app.covered));
    if (app.locked || app.covered) { renderLock(); renderModal(); renderToast(); window.scrollTo(0, 0); return; }
    const root = $("#app"), scroll = window.scrollY, focusId = document.activeElement?.id, selStart = document.activeElement?.selectionStart;
    root.innerHTML = shell(); app.enter = false; L.dom(root);
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch { /* */ } } }
    window.scrollTo(0, scroll);
    renderModal(); renderToast();
  }
  function renderToast() {
    const el = $("#toast");
    if (app.locked || app.covered) { el.innerHTML = ""; return; }
    el.innerHTML = app.toast ? `<div class="toast${app.toastAction ? " has-act" : ""}" role="status"><span>${esc(app.toast)}</span>${app.toastAction ? `<button class="toast-act" data-act="toast-undo">${esc(app.toastAction.label)}</button>` : ""}<button class="icon-btn" data-act="toast-x" aria-label="סגירה">${I("x", 16)}</button></div>` : "";
    L.dom(el);
  }
  function go(tab, top = true) {
    app.enter = tab !== app.tab; app.tab = tab;
    try { history.replaceState(null, "", "#" + tab); } catch { /* */ }
    render(); if (top) window.scrollTo(0, 0);
  }

  /* ---------- חלונות ---------- */
  function renderModal() {
    const host = $("#modal"), m = app.locked || app.covered ? null : app.modal;
    if (!m) {
      if (host.firstChild) { host.innerHTML = ""; document.body.classList.remove("locked"); app.modalReturn?.isConnected && app.modalReturn.focus({ preventScroll: true }); app.modalReturn = null; }
      return;
    }
    const fresh = !host.firstChild, keep = !fresh && host.querySelector(".sheet")?.scrollTop;
    if (fresh) app.modalReturn = document.activeElement;
    document.body.classList.add("locked");
    host.innerHTML = `<div class="scrim${fresh ? " in" : ""}" data-act="close-modal"></div><div class="sheet${fresh ? " in" : ""}" role="dialog" aria-modal="true" aria-labelledby="m-title">${modalBody(m)}</div>`;
    L.dom(host);
    if (keep) host.querySelector(".sheet").scrollTop = keep;
    const first = host.querySelector("[autofocus]") || host.querySelector("input:not([type=hidden]),select,textarea,button");
    if (fresh) first?.focus({ preventScroll: true });
  }
  function modalBody(m) {

        <div class="pair"><label class="field" for="e-date">${f.type === "manual" ? "התאריך של יום העונה" : "תאריך"}<input id="e-date" name="date" type="date" required min="2000-01-01" max="2100-12-31" value="${f.date}"><small class="hebdate" id="e-heb">${esc(hebHint)}</small></label>

    }
    if (m.kind === "prep") {
      const list = state().settings.checklist, total = M.CHECKLIST.length, n = M.CHECKLIST.filter(x => list.includes(x)).length;

  syncSecure();
  if (!app.locked && !storage.get(SEEN_KEY) && !app.personal.events.length) { app.modal = { kind: "welcome" }; renderModal(); }
  if (BIO()) BIO().checkBiometry().then(r => { app.bio = r; if (app.locked && lockCfg()?.bio && r.isAvailable) tryBio(); else if (!app.locked && app.tab === "prefs" && !app.modal) render(); }).catch(() => { app.bio = null; });
  setInterval(tick, 30000);
  /** יציאה לרקע: נעילה מיד, או כיסוי המסך (בלי נתונים) עד שיעבור זמן הנעילה שנבחר */
  let awayAt = 0;
  function onHide() {
    if (awayAt) return;
    awayAt = Date.now();
    const c = lockCfg();
    if (!c || app.locked || app.awayOk > Date.now()) return;
    if (!Number(c.after)) lockNow(); else { app.covered = true; render(); }
  }
  function onShow() {
    if (!awayAt) return;
    const gone = (Date.now() - awayAt) / 1000, c = lockCfg(), expected = app.awayOk > awayAt;
    awayAt = 0; app.awayOk = 0;
    if (c && !app.locked) {
      const limit = expected ? Math.max(Number(c.after) || 0, 600) : Number(c.after) || 0;
      app.covered = false;
      if (gone > limit) lockNow(); else render();
    } else if (app.locked && lockCfg()?.bio && app.bio?.isAvailable && !expected) tryBio();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return onHide();
    onShow();
    tick(); if (NATIVE) syncNotifications().then(() => { if (app.tab === "dates" && !app.modal && !app.locked) render(); });
  });
  if (NATIVE && PL.App) PL.App.addListener("appStateChange", ({ isActive }) => { if (isActive) onShow(); else onHide(); });
  document.addEventListener("keydown", e => {
    if (!app.locked || !app.lock || app.lock.view !== "pin") return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pinDigit(e.key); } else if (e.key === "Backspace") { e.preventDefault(); pinDigit("del"); }
  });
  if (NATIVE && PL.App) PL.App.addListener("backButton", () => {
    if (app.locked || app.covered) { if (app.lock && app.lock.view !== "pin") { app.lock.view = "pin"; return renderLock(); } return PL.App.minimizeApp(); }
    if (app.modal) { if (app.modal.kind === "welcome") markSeen(); app.modal = null; renderModal(); }
    else if (app.tab === "review") go("prefs");
    else if (app.tab !== "today") go("today");
    else PL.App.minimizeApp();
  });
  if (NATIVE) syncNotifications().then(() => { if (app.tab === "dates" && !app.modal && !app.locked) render(); });
  // אתר: התקנה למסך הבית ועבודה בלי רשת
  if (!NATIVE && "serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
