name: ios-app
# בונה את אפליקציית ה-iOS (Capacitor) על מק של GitHub.
# - build-simulator: בכל דחיפה. בנייה לא חתומה לסימולטור, הפעלה בסימולטור וצילום מסך, כדי להוכיח שהכול מתקמפל ועולה.
# - testflight: רק בהפעלה ידנית (Actions > ios-app > Run workflow, לסמן "testflight").
#   בונה ארכיון חתום ומעלה ל-App Store Connect / TestFlight. דורש את הסודות (Settings > Secrets and variables > Actions):
#     APPLE_TEAM_ID        מזהה הצוות (10 תווים) מ-developer.apple.com > Membership
#     ASC_KEY_ID           מזהה מפתח ה-API של App Store Connect (Users and Access > Integrations > App Store Connect API)
#     ASC_ISSUER_ID        ה-Issuer ID שמופיע באותו עמוד
#     ASC_KEY_P8_BASE64    תוכן קובץ ה-AuthKey_XXXX.p8 בקידוד base64 (במק: base64 -i AuthKey_XXXX.p8 | pbcopy)
#   המפתח צריך תפקיד Admin כדי ש-Xcode ייצור בעצמו תעודת הפצה ופרופיל (חתימה אוטומטית בענן).
on:
  push:
    paths: ["ios/**", "fonts/**", "index.html", "android/prepare.py", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "לבנות גרסה חתומה ולהעלות ל-TestFlight (דורש סודות של App Store Connect)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true
env:
  # App Store Connect דורש Xcode 26 ומעלה (iOS 26 SDK) לכל העלאה, מאז 28.4.2026
  MIN_XCODE: "26"
jobs:
  build-simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Choose the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          V=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          [ "$V" -ge "$MIN_XCODE" ] || { echo "::error::Xcode $V is older than $MIN_XCODE"; exit 1; }
      - name: Generate the iOS project
        working-directory: ios
        run: |
          pip install --quiet pillow
          python3 prepare.py www
          npm install --no-audit --no-fund
          npx cap add ios
          python3 prepare.py native
          npx cap sync ios
      - name: Build for the simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -40
          APP=build/dd/Build/Products/Release-iphonesimulator/App.app
          ls "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/he.lproj/InfoPlist.strings"
          test -f "$APP/public/index.html"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion|UIUserInterfaceStyle|DTXcode|DTSDKName|NSLocation"
      - name: Launch in the simulator
        run: |
          APP=build/dd/Build/Products/Release-iphonesimulator/App.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'])")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" io.github.nrt613.maayan
          sleep 25
          mkdir -p out
          xcrun simctl io "$UDID" screenshot out/ios-simulator.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i maayan || { echo "::error::the app is not running"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maayan-ios-simulator-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build-simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!s}" ] || { echo "::error::Missing secret $s (see the top of ios.yml and store/CHECKLIST.md)"; exit 1; }
          done
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Choose the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the iOS project
        working-directory: ios
        run: |
          pip install --quiet pillow
          python3 prepare.py www
          npm install --no-audit --no-fund
          npx cap add ios
          python3 prepare.py native
          npx cap sync ios
      - name: Archive (signed) and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Maayan.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic $AUTH archive | tail -30
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Maayan.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export $AUTH | tail -30
          echo "Uploaded build $(cat out/ios-version.txt) (${GITHUB_RUN_NUMBER}). It appears in App Store Connect > TestFlight after processing."
