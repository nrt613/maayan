name: windows-installer-test
on:
  push:
    paths: ["download/**", ".github/workflows/windows-test.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with a Hebrew folder name
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:LOCALAPPDATA "בדיקה_עברית"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath "download\Maayan-Setup.exe" -PassThru
          Start-Sleep -Seconds 15
          $dir = Join-Path $env:LOCALAPPDATA "Maayan"
          $desk = [Environment]::GetFolderPath('Desktop')
          $prog = [Environment]::GetFolderPath('Programs')
          "--- installed files ---"; Get-ChildItem -LiteralPath $dir | ForEach-Object { "$($_.Name) $($_.Length)" }
          "--- install log ---"; Get-Content -LiteralPath "$dir\install.log" -Encoding utf8 -ErrorAction SilentlyContinue
          $sh = New-Object -ComObject Shell.Application
          foreach ($d in @($desk, $prog)) {
            $lnk = Get-ChildItem -LiteralPath $d -Filter "*.lnk" | Where-Object { $_.Name -eq "מעיין.lnk" } | Select-Object -First 1
            if (-not $lnk) { throw "no shortcut in $d" }
            $link = $sh.Namespace($d).ParseName($lnk.Name).GetLink
            "shortcut: $($lnk.Name) -> $($link.Path)"
            if ($link.Path -ne "$dir\maayan.html") { throw "bad target $($link.Path)" }
          }
          "message box open: " + (-not $p.HasExited)
          Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | ForEach-Object { "window: $($_.ProcessName) / $($_.MainWindowTitle)" }
          $a = (Get-Content -LiteralPath "$dir\maayan.html" -Raw -Encoding utf8) -replace "`r",""; $b = (Get-Content index.html -Raw -Encoding utf8) -replace "`r",""
          if ($a -ne $b) { throw "installed html differs" }
          "INSTALL OK"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Engine tests on Windows Node
        shell: pwsh
        run: |
          node -e "const M=require('./src/core.js');const r=require('./src/tests.js')(M).run();const f=r.filter(t=>!t.ok);console.log('engine tests on Windows:',r.length-f.length+'/'+r.length);f.forEach(t=>console.log('FAIL',t.name,t.error));process.exit(f.length?1:0)"
          node verify.js
